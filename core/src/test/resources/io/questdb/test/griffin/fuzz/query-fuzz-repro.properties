# QueryFuzzTest repro-case registry.
#
# Every case is a fuzz failure worth replaying, recorded when it is triaged or
# fixed, so a seed pair survives outside the CI log. Each case has:
#
#   case.<name>.method      - the QueryFuzzTest method to run
#   case.<name>.s0/.s1      - the questdb.fuzz.s0/s1 seed pair from the run's
#                             "random seeds: ..." line
#   case.<name>.commit      - the commit the failure was seen on
#   case.<name>.build       - the build number it was seen on
#   case.<name>.description - one line: what diverges and where
#
# Replay one case with, from the repository root:
#
#   mvn -Dtest=QueryFuzzTest#<method> -Dquestdb.fuzz.repro=<name> test
#
# The stored seed pair is copied into questdb.fuzz.s0/s1, so the run replays
# exactly as it did when the failure was recorded.

