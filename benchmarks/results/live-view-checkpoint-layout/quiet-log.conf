# Log configuration for a matrix run, selected with -Dout=<this file>.
#
# The default configuration writes the server log to stdout through a writer thread of its
# own, which does not share System.out's lock, so a log record can land in the middle of a
# printf'd report line - and it does. A run's output file is the report, so the log goes to
# a file here and stdout carries the report alone.
writers=file
w.file.class=io.questdb.log.LogFileWriter
w.file.location=matrix-run.log
w.file.level=ERROR
