name: Github Release - Binaries

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Package immutable source without publishing GitHub assets or AMIs
        required: true
        default: package-only
        type: choice
        options:
          - package-only

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a valid release tag (expected numeric x.y.z or x.y.z.w)"
            exit 1
          fi
          echo "Tag '${GITHUB_REF_NAME}' is a valid release tag"

  native-release-lifecycle:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install GraalVM Community 25.0.2
        run: |
          set -eux
          GRAAL_VERSION=25.0.2
          TAG="jdk-${GRAAL_VERSION}"
          FILENAME="graalvm-community-jdk-${GRAAL_VERSION}_linux-x64_bin.tar.gz"
          BASE_URL="https://github.com/graalvm/graalvm-ce-builds/releases/download/${TAG}"
          curl -L -o "${FILENAME}" "${BASE_URL}/${FILENAME}"
          curl -L -o "${FILENAME}.sha256" "${BASE_URL}/${FILENAME}.sha256"
          HASH="$(cut -d ' ' -f1 "${FILENAME}.sha256")"
          echo "${HASH}  ${FILENAME}" | sha256sum -c -
          INSTALL_DIR="${HOME}/graalvm-community-jdk-${GRAAL_VERSION}"
          mkdir -p "${INSTALL_DIR}"
          tar -xzf "${FILENAME}" -C "${INSTALL_DIR}" --strip-components=1
          echo "JAVA_HOME=${INSTALL_DIR}" >> "$GITHUB_ENV"
          echo "GRAALVM_HOME=${INSTALL_DIR}" >> "$GITHUB_ENV"
          echo "${INSTALL_DIR}/bin" >> "$GITHUB_PATH"
      - name: Exercise native release Maven lifecycle
        run: RUN_MAVEN_LIFECYCLE_TESTS=1 .github/scripts/test-native-release-packaging.sh

  build-rust-linux-x64:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      producer-attempt: ${{ github.run_attempt }}
      rust-version: ${{ steps.rust-metadata.outputs.rust-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Build Rust in manylinux2014 (glibc 2.17)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c '
              set -eux
              yum install -y python3 curl
              curl https://sh.rustup.rs -sSf | sh -s -- -y --no-modify-path --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              cd /build/core/rust/qdbr
              cargo build --release
              rustc --version --verbose > /build/.rust-version-linux-x64
            '
      - id: rust-metadata
        run: |
          echo "rust-version=$(tr '\n' ';' < .rust-version-linux-x64)" >> "$GITHUB_OUTPUT"
          rm .rust-version-linux-x64
      - id: upload
        uses: actions/upload-artifact@v6
        with:
          name: rust-linux-x64
          path: core/rust/qdbr/target/release/libquestdbr.so
          if-no-files-found: error
          overwrite: true

  build-rust-linux-arm64:
    needs: validate-tag
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      producer-attempt: ${{ github.run_attempt }}
      rust-version: ${{ steps.rust-metadata.outputs.rust-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Build Rust in manylinux_2_28 (glibc 2.28)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -c '
              set -eux
              yum install -y python3 curl
              curl https://sh.rustup.rs -sSf | sh -s -- -y --no-modify-path --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              cd /build/core/rust/qdbr
              cargo build --release
              rustc --version --verbose > /build/.rust-version-linux-arm64
            '
      - id: rust-metadata
        run: |
          echo "rust-version=$(tr '\n' ';' < .rust-version-linux-arm64)" >> "$GITHUB_OUTPUT"
          rm .rust-version-linux-arm64
      - id: upload
        uses: actions/upload-artifact@v6
        with:
          name: rust-linux-arm64
          path: core/rust/qdbr/target/release/libquestdbr.so
          if-no-files-found: error
          overwrite: true

  build-rust-macos-arm64:
    needs: validate-tag
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      producer-attempt: ${{ github.run_attempt }}
      rust-version: ${{ steps.rust-metadata.outputs.rust-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Build Rust
        run: |
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd core/rust/qdbr
          cargo build --release
          rustc --version --verbose > "${GITHUB_WORKSPACE}/.rust-version-macos-arm64"
      - id: rust-metadata
        run: |
          echo "rust-version=$(tr '\n' ';' < .rust-version-macos-arm64)" >> "$GITHUB_OUTPUT"
          rm .rust-version-macos-arm64
      - id: upload
        uses: actions/upload-artifact@v6
        with:
          name: rust-macos-arm64
          path: core/rust/qdbr/target/release/libquestdbr.dylib
          if-no-files-found: error
          overwrite: true

  build-rust-windows:
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      producer-attempt: ${{ github.run_attempt }}
      rust-version: ${{ steps.rust-metadata.outputs.rust-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Build Rust
        run: |
          cd core/rust/qdbr
          cargo build --release
          rustc --version --verbose | Out-File -Encoding ascii "$env:GITHUB_WORKSPACE\.rust-version-windows"
      - id: rust-metadata
        shell: bash
        run: |
          echo "rust-version=$(tr -d '\r' < .rust-version-windows | tr '\n' ';')" >> "$GITHUB_OUTPUT"
          rm .rust-version-windows
      - id: upload
        uses: actions/upload-artifact@v6
        with:
          name: rust-windows
          path: core/rust/qdbr/target/release/questdbr.dll
          if-no-files-found: error
          overwrite: true

  package-linux:
    needs:
      - native-release-lifecycle
      - build-rust-linux-x64
      - build-rust-linux-arm64
      - build-rust-macos-arm64
      - build-rust-windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      raw-linux-x64-artifact-id: ${{ needs.build-rust-linux-x64.outputs.artifact-id }}
      raw-linux-x64-artifact-digest: ${{ needs.build-rust-linux-x64.outputs.artifact-digest }}
      raw-linux-x64-producer-attempt: ${{ needs.build-rust-linux-x64.outputs.producer-attempt }}
      raw-linux-x64-rust-version: ${{ needs.build-rust-linux-x64.outputs.rust-version }}
      raw-linux-arm64-artifact-id: ${{ needs.build-rust-linux-arm64.outputs.artifact-id }}
      raw-linux-arm64-artifact-digest: ${{ needs.build-rust-linux-arm64.outputs.artifact-digest }}
      raw-linux-arm64-producer-attempt: ${{ needs.build-rust-linux-arm64.outputs.producer-attempt }}
      raw-linux-arm64-rust-version: ${{ needs.build-rust-linux-arm64.outputs.rust-version }}
      raw-macos-arm64-artifact-id: ${{ needs.build-rust-macos-arm64.outputs.artifact-id }}
      raw-macos-arm64-artifact-digest: ${{ needs.build-rust-macos-arm64.outputs.artifact-digest }}
      raw-macos-arm64-producer-attempt: ${{ needs.build-rust-macos-arm64.outputs.producer-attempt }}
      raw-macos-arm64-rust-version: ${{ needs.build-rust-macos-arm64.outputs.rust-version }}
      raw-windows-artifact-id: ${{ needs.build-rust-windows.outputs.artifact-id }}
      raw-windows-artifact-digest: ${{ needs.build-rust-windows.outputs.artifact-digest }}
      raw-windows-producer-attempt: ${{ needs.build-rust-windows.outputs.producer-attempt }}
      raw-windows-rust-version: ${{ needs.build-rust-windows.outputs.rust-version }}
      native-artifact-id: ${{ steps.upload-native.outputs.artifact-id }}
      native-artifact-digest: ${{ steps.upload-native.outputs.artifact-digest }}
      native-producer-attempt: ${{ github.run_attempt }}
      licenses-artifact-id: ${{ steps.upload-licenses.outputs.artifact-id }}
      licenses-artifact-digest: ${{ steps.upload-licenses.outputs.artifact-digest }}
      licenses-producer-attempt: ${{ github.run_attempt }}
      release-artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      release-artifact-digest: ${{ steps.upload-release.outputs.artifact-digest }}
      evidence-artifact-id: ${{ steps.upload-evidence.outputs.artifact-id }}
      evidence-artifact-digest: ${{ steps.upload-evidence.outputs.artifact-digest }}
      producer-attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install GraalVM Community 25.0.2
        run: |
          set -eux
          GRAAL_VERSION=25.0.2
          TAG="jdk-${GRAAL_VERSION}"
          FILENAME="graalvm-community-jdk-${GRAAL_VERSION}_linux-x64_bin.tar.gz"
          BASE_URL="https://github.com/graalvm/graalvm-ce-builds/releases/download/${TAG}"
          curl -L -o "${FILENAME}" "${BASE_URL}/${FILENAME}"
          curl -L -o "${FILENAME}.sha256" "${BASE_URL}/${FILENAME}.sha256"
          HASH="$(cut -d ' ' -f1 "${FILENAME}.sha256")"
          echo "${HASH}  ${FILENAME}" | sha256sum -c -
          INSTALL_DIR="${HOME}/graalvm-community-jdk-${GRAAL_VERSION}"
          mkdir -p "${INSTALL_DIR}"
          tar -xzf "${FILENAME}" -C "${INSTALL_DIR}" --strip-components=1
          echo "JAVA_HOME=${INSTALL_DIR}" >> "$GITHUB_ENV"
          echo "GRAALVM_HOME=${INSTALL_DIR}" >> "$GITHUB_ENV"
          echo "${INSTALL_DIR}/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build-rust-linux-x64.outputs.artifact-id }}
          path: core/target/downloaded-rust-artifacts/rust-linux-x64
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build-rust-linux-arm64.outputs.artifact-id }}
          path: core/target/downloaded-rust-artifacts/rust-linux-arm64
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build-rust-macos-arm64.outputs.artifact-id }}
          path: core/target/downloaded-rust-artifacts/rust-macos-arm64
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build-rust-windows.outputs.artifact-id }}
          path: core/target/downloaded-rust-artifacts/rust-windows
      - name: Stage exact Rust libraries
        run: .github/scripts/stage-rust-native-artifacts.sh
      - name: Reject an aggregate build without -DskipNative
        run: |
          set -euo pipefail
          mkdir -p fake-bin
          cat > fake-bin/cargo <<'EOF'
          #!/usr/bin/env bash
          echo cargo-invoked >> "${GITHUB_WORKSPACE}/cargo-invoked.log"
          exit 99
          EOF
          chmod +x fake-bin/cargo
          set +e
          PATH="${PWD}/fake-bin:${PATH}" mvn -B -pl core -am compile -P include-rust-native-artifacts,local-client > aggregate-without-skipnative.log 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            cat aggregate-without-skipnative.log >&2
            exit 1
          fi
          grep -F 'include-rust-native-artifacts requires -DskipNative' aggregate-without-skipnative.log
          test ! -e cargo-invoked.log
      - name: Reject Central deploy without the aggregate profile
        run: |
          set -euo pipefail
          set +e
          mvn -B -pl core -DskipNative -P maven-central-release validate > central-without-aggregate.log 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            cat central-without-aggregate.log >&2
            exit 1
          fi
          grep -F 'Profile "include-rust-native-artifacts" is not activated.' central-without-aggregate.log
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06
        with:
          toolchain: nightly-2025-09-24
          # The action exports RUSTFLAGS=-D warnings by default; keep the
          # verify step's from-source build on the same flags as every other
          # release build, which sets none.
          rustflags: ""
      - name: Regenerate THIRD_PARTY_LICENSES.txt
        run: bash ci/generate_third_party_licenses.sh
        env:
          CARGO_DENY_VERSION: "0.19.8"
      - id: upload-native
        uses: actions/upload-artifact@v6
        with:
          name: rust-native-libs
          path: core/target/native-libs
          if-no-files-found: error
          overwrite: true
      - id: upload-licenses
        uses: actions/upload-artifact@v6
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          overwrite: true
      - name: Build QuestDB from the root reactor
        run: |
          set -eux
          profiles=build-web-console,build-binaries,include-rust-native-artifacts
          client_version="$(sed -n 's/.*<questdb.client.version>\(.*\)<\/questdb.client.version>.*/\1/p' core/pom.xml | head -1)"
          if [[ "${client_version}" == *-SNAPSHOT ]]; then
            profiles="${profiles},local-client"
          fi
          mvn -B -pl core -am package -DskipTests -DskipNative -Dhttp.keepAlive=false -P "${profiles}"
      - name: Verify core jar and Linux runtime archive
        run: |
          set -eux
          core_jar="$(find core/target -maxdepth 1 -type f -name 'questdb-*.jar' ! -name '*-tests.jar' | head -1)"
          runtime_archive="$(find core/target -maxdepth 1 -type f -name 'questdb-*-rt-linux-x86-64.tar.gz' | head -1)"
          test -n "${core_jar}"
          test -n "${runtime_archive}"
          .github/scripts/verify-rust-native-jar.sh "${core_jar}" core/target/native-libs | tee core/target/rust-native-jar-linux.manifest
          .github/scripts/verify-rust-native-runtime-archive.sh "${runtime_archive}" linux-x86-64 core/target/native-libs | tee core/target/rust-native-runtime-linux.manifest
      - id: upload-evidence
        uses: actions/upload-artifact@v6
        with:
          name: rust-native-evidence-linux
          path: |
            core/target/rust-native-jar-linux.manifest
            core/target/rust-native-runtime-linux.manifest
          if-no-files-found: error
          overwrite: true
      - id: upload-release
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: core/target/questdb-*.tar.gz
          if-no-files-found: error
          overwrite: true
      - name: Verify aggregate-to-normal transition
        run: |
          set -euo pipefail
          profiles=local-client
          client_version="$(sed -n 's/.*<questdb.client.version>\(.*\)<\/questdb.client.version>.*/\1/p' core/pom.xml | head -1)"
          if [[ "${client_version}" != *-SNAPSHOT ]]; then
            profiles=""
          fi
          if [[ -n "${profiles}" ]]; then
            mvn -B -pl core -am compile -DskipTests -P "${profiles}"
          else
            mvn -B -pl core -am compile -DskipTests
          fi
          mapfile -t rust_libraries < <(find core/target/classes/io/questdb/bin -type f \( -name libquestdbr.so -o -name libquestdbr.dylib -o -name questdbr.dll \) | LC_ALL=C sort)
          test "${#rust_libraries[@]}" -eq 1
          test "${rust_libraries[0]}" = "core/target/classes/io/questdb/bin/linux-x86-64/libquestdbr.so"
          # rust-maven-plugin also copies the crate's [[bin]] targets; the
          # build-rust-library profile must have removed them again.
          test -z "$(find core/target/classes/io/questdb/bin -type f -name 'pm_*')"

  package-windows:
    needs:
      - package-linux
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      release-artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      release-artifact-digest: ${{ steps.upload-release.outputs.artifact-digest }}
      evidence-artifact-id: ${{ steps.upload-evidence.outputs.artifact-id }}
      evidence-artifact-digest: ${{ steps.upload-evidence.outputs.artifact-digest }}
      producer-attempt: ${{ github.run_attempt }}
      provenance-artifact-id: ${{ steps.upload-provenance.outputs.artifact-id }}
      provenance-artifact-digest: ${{ steps.upload-provenance.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install GraalVM Community 25.0.2
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $GRAAL_VERSION = "25.0.2"
          $tag = "jdk-$GRAAL_VERSION"
          $fileName = "graalvm-community-jdk-$GRAAL_VERSION`_windows-x64_bin.zip"
          $baseUrl = "https://github.com/graalvm/graalvm-ce-builds/releases/download/$tag"
          $zipPath = Join-Path $env:USERPROFILE $fileName
          $shaPath = "$zipPath.sha256"
          Invoke-WebRequest "$baseUrl/$fileName" -OutFile $zipPath
          Invoke-WebRequest "$baseUrl/$fileName.sha256" -OutFile $shaPath
          $expected = (Get-Content $shaPath).Split(" ")[0].ToLower()
          $actual = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            throw "SHA256 mismatch for $fileName. Expected $expected but got $actual"
          }
          $dest = Join-Path $env:USERPROFILE "graalvm-ce-25"
          Expand-Archive $zipPath -DestinationPath $dest
          $dir = Get-ChildItem $dest | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          $graalHome = $dir.FullName
          echo "JAVA_HOME=$graalHome" >> $env:GITHUB_ENV
          echo "GRAALVM_HOME=$graalHome" >> $env:GITHUB_ENV
          echo "$graalHome\bin" >> $env:GITHUB_PATH
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.package-linux.outputs.native-artifact-id }}
          path: core/target/native-libs
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.package-linux.outputs.licenses-artifact-id }}
          path: .
      - name: Build QuestDB from the root reactor
        shell: bash
        run: |
          set -eux
          profiles=build-web-console,build-binaries,include-rust-native-artifacts
          client_version="$(sed -n 's/.*<questdb.client.version>\(.*\)<\/questdb.client.version>.*/\1/p' core/pom.xml | head -1)"
          if [[ "${client_version}" == *-SNAPSHOT ]]; then
            profiles="${profiles},local-client"
          fi
          mvn -B -pl core -am package -DskipTests -DskipNative "-Dhttp.keepAlive=false" -P "${profiles}"
      - name: Verify core jar and Windows runtime archive
        shell: bash
        run: |
          set -eux
          core_jar="$(find core/target -maxdepth 1 -type f -name 'questdb-*.jar' ! -name '*-tests.jar' | head -1)"
          runtime_archive="$(find core/target -maxdepth 1 -type f -name 'questdb-*-rt-windows-x86-64.tar.gz' | head -1)"
          test -n "${core_jar}"
          test -n "${runtime_archive}"
          .github/scripts/verify-rust-native-jar.sh "${core_jar}" core/target/native-libs | tee core/target/rust-native-jar-windows.manifest
          .github/scripts/verify-rust-native-runtime-archive.sh "${runtime_archive}" windows-x86-64 core/target/native-libs | tee core/target/rust-native-runtime-windows.manifest
      - id: upload-evidence
        uses: actions/upload-artifact@v6
        with:
          name: rust-native-evidence-windows
          path: |
            core/target/rust-native-jar-windows.manifest
            core/target/rust-native-runtime-windows.manifest
          if-no-files-found: error
          overwrite: true
      - id: upload-release
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: core/target/questdb-*-rt-windows-x86-64.tar.gz
          if-no-files-found: error
          overwrite: true
      - name: Write package provenance
        shell: bash
        env:
          RAW_LINUX_X64_ID: ${{ needs.package-linux.outputs.raw-linux-x64-artifact-id }}
          RAW_LINUX_X64_DIGEST: ${{ needs.package-linux.outputs.raw-linux-x64-artifact-digest }}
          RAW_LINUX_X64_ATTEMPT: ${{ needs.package-linux.outputs.raw-linux-x64-producer-attempt }}
          RUST_LINUX_X64: ${{ needs.package-linux.outputs.raw-linux-x64-rust-version }}
          RAW_LINUX_ARM64_ID: ${{ needs.package-linux.outputs.raw-linux-arm64-artifact-id }}
          RAW_LINUX_ARM64_DIGEST: ${{ needs.package-linux.outputs.raw-linux-arm64-artifact-digest }}
          RAW_LINUX_ARM64_ATTEMPT: ${{ needs.package-linux.outputs.raw-linux-arm64-producer-attempt }}
          RUST_LINUX_ARM64: ${{ needs.package-linux.outputs.raw-linux-arm64-rust-version }}
          RAW_MACOS_ARM64_ID: ${{ needs.package-linux.outputs.raw-macos-arm64-artifact-id }}
          RAW_MACOS_ARM64_DIGEST: ${{ needs.package-linux.outputs.raw-macos-arm64-artifact-digest }}
          RAW_MACOS_ARM64_ATTEMPT: ${{ needs.package-linux.outputs.raw-macos-arm64-producer-attempt }}
          RUST_MACOS_ARM64: ${{ needs.package-linux.outputs.raw-macos-arm64-rust-version }}
          RAW_WINDOWS_ID: ${{ needs.package-linux.outputs.raw-windows-artifact-id }}
          RAW_WINDOWS_DIGEST: ${{ needs.package-linux.outputs.raw-windows-artifact-digest }}
          RAW_WINDOWS_ATTEMPT: ${{ needs.package-linux.outputs.raw-windows-producer-attempt }}
          RUST_WINDOWS: ${{ needs.package-linux.outputs.raw-windows-rust-version }}
          NATIVE_ID: ${{ needs.package-linux.outputs.native-artifact-id }}
          NATIVE_DIGEST: ${{ needs.package-linux.outputs.native-artifact-digest }}
          NATIVE_ATTEMPT: ${{ needs.package-linux.outputs.native-producer-attempt }}
          LICENSE_ID: ${{ needs.package-linux.outputs.licenses-artifact-id }}
          LICENSE_DIGEST: ${{ needs.package-linux.outputs.licenses-artifact-digest }}
          LICENSE_ATTEMPT: ${{ needs.package-linux.outputs.licenses-producer-attempt }}
          LINUX_RELEASE_ID: ${{ needs.package-linux.outputs.release-artifact-id }}
          LINUX_RELEASE_DIGEST: ${{ needs.package-linux.outputs.release-artifact-digest }}
          LINUX_RELEASE_ATTEMPT: ${{ needs.package-linux.outputs.producer-attempt }}
          LINUX_EVIDENCE_ID: ${{ needs.package-linux.outputs.evidence-artifact-id }}
          LINUX_EVIDENCE_DIGEST: ${{ needs.package-linux.outputs.evidence-artifact-digest }}
          LINUX_EVIDENCE_ATTEMPT: ${{ needs.package-linux.outputs.producer-attempt }}
          WINDOWS_RELEASE_ID: ${{ steps.upload-release.outputs.artifact-id }}
          WINDOWS_RELEASE_DIGEST: ${{ steps.upload-release.outputs.artifact-digest }}
          WINDOWS_RELEASE_ATTEMPT: ${{ github.run_attempt }}
          WINDOWS_EVIDENCE_ID: ${{ steps.upload-evidence.outputs.artifact-id }}
          WINDOWS_EVIDENCE_DIGEST: ${{ steps.upload-evidence.outputs.artifact-digest }}
          WINDOWS_EVIDENCE_ATTEMPT: ${{ github.run_attempt }}
          WINDOWS_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifacts = [
              ("rust-linux-x64", "RAW_LINUX_X64", "build-rust-linux-x64"),
              ("rust-linux-arm64", "RAW_LINUX_ARM64", "build-rust-linux-arm64"),
              ("rust-macos-arm64", "RAW_MACOS_ARM64", "build-rust-macos-arm64"),
              ("rust-windows", "RAW_WINDOWS", "build-rust-windows"),
              ("rust-native-libs", "NATIVE", "package-linux"),
              ("third-party-licenses", "LICENSE", "package-linux"),
              ("release-linux", "LINUX_RELEASE", "package-linux"),
              ("rust-native-evidence-linux", "LINUX_EVIDENCE", "package-linux"),
              ("release-windows", "WINDOWS_RELEASE", "package-windows"),
              ("rust-native-evidence-windows", "WINDOWS_EVIDENCE", "package-windows"),
          ]
          entries = []
          for name, prefix, producer in artifacts:
              entries.append({
                  "name": name,
                  "id": os.environ[prefix + "_ID"],
                  "digest": os.environ[prefix + "_DIGEST"],
                  "producer_job": producer,
                  "producer_attempt": os.environ[prefix + "_ATTEMPT"],
              })
          native_manifest = Path("core/target/rust-native-jar-windows.manifest")
          license_file = Path("THIRD_PARTY_LICENSES.txt")
          payload = {
              "run_id": os.environ["RUN_ID"],
              "event": os.environ["EVENT_NAME"],
              "ref": os.environ["REF"],
              "head_sha": os.environ["HEAD_SHA"],
              "producer_attempt": os.environ["WINDOWS_ATTEMPT"],
              "actions": {
                  "checkout": "actions/checkout@v5",
                  "download_artifact": "actions/download-artifact@v7",
                  "upload_artifact": "actions/upload-artifact@v6",
              },
              "containers": {
                  "linux_x64": "quay.io/pypa/manylinux2014_x86_64",
                  "linux_arm64": "quay.io/pypa/manylinux_2_28_aarch64",
              },
              "rust_versions": {
                  "linux_x64": os.environ["RUST_LINUX_X64"],
                  "linux_arm64": os.environ["RUST_LINUX_ARM64"],
                  "macos_arm64": os.environ["RUST_MACOS_ARM64"],
                  "windows_x64": os.environ["RUST_WINDOWS"],
              },
              "artifacts": entries,
              "native_manifest_sha256": hashlib.sha256(native_manifest.read_bytes()).hexdigest(),
              "license_manifest_sha256": hashlib.sha256(license_file.read_bytes()).hexdigest(),
          }
          Path("core/target/native-release-provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY
      - id: upload-provenance
        uses: actions/upload-artifact@v6
        with:
          name: native-release-provenance
          path: core/target/native-release-provenance.json
          if-no-files-found: error
          overwrite: true

  publish-github:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - package-linux
      - package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.package-linux.outputs.release-artifact-id }}
          path: artifacts/linux
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.package-windows.outputs.release-artifact-id }}
          path: artifacts/windows
      - name: Upload or verify every GitHub release asset
        run: .github/scripts/publish-github-release-assets.sh "${GITHUB_REF_NAME}" artifacts/linux artifacts/windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The asset script publishes the draft with the Actions token, and GitHub
  # does not start workflows from events caused by that token, so the
  # release:published trigger of release_website.yml never fires. Dispatch the
  # website rebuild explicitly. It is its own job so that a failed dispatch is
  # visible on the run but does not block AMI publication, which depends only
  # on the published release assets.
  publish-website:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish-github.result == 'success' }}
    needs:
      - publish-github
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger the questdb.io rebuild
        run: gh workflow run release_website.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-ami:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish-github.result == 'success' }}
    needs:
      - publish-github
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Install Packer
        run: |
          set -euo pipefail
          PACKER_VERSION=1.10.0
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y "packer=${PACKER_VERSION}-1" jq
          # The runner image ships a newer Packer in /usr/local/bin, which
          # precedes /usr/bin on PATH, so a bare "packer" would ignore the
          # apt pin. Address the pinned binary explicitly.
          /usr/bin/packer version | grep -F "Packer v${PACKER_VERSION}"
          echo "PACKER_BIN=/usr/bin/packer" >> "${GITHUB_ENV}"
      - name: Refuse to replace an existing release AMI
        run: |
          AMI_REGIONS="$(.github/scripts/publish-ami-release.sh preflight "${GITHUB_REF_NAME}")"
          echo "AMI_REGIONS=${AMI_REGIONS}" >> "${GITHUB_ENV}"
      - name: Deploy AMI without destructive replacement
        run: .github/scripts/publish-ami-release.sh publish "${GITHUB_REF_NAME}" "${AMI_REGIONS}"
