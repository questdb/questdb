name: Build questdb.io on release

on:
  release:
    types: [published]
  # The release workflow (github-binaries-release.yml) publishes the draft
  # release with the Actions token, and GitHub does not start workflows from
  # events caused by that token. The release workflow therefore dispatches this
  # one explicitly after the assets are published.
  workflow_dispatch:

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl -X POST $NETLIFY_BUILD_HOOK_URL
