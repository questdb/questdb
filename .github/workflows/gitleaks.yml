name: Gitleaks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      HAS_GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        if: ${{ env.HAS_GITLEAKS_LICENSE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Suppress the action's per-finding pull request comment. It tells the
          # author to paste a four-part <commit>:<file>:<rule-id>:<start-line>
          # fingerprint, which stops matching once the PR is squash-merged and
          # then fails the push scan of master. See .gitleaksignore for the form
          # that survives. Findings still fail the job and appear in its summary.
          GITLEAKS_ENABLE_COMMENTS: "false"
      # gitleaks prints that same four-part fingerprint itself, labelled
      # "Fingerprint:", in the log of the step above. Dropping the comment
      # removes the instruction but not the value, so append the form that does
      # survive a squash to the summary the failure warning already points at.
      - name: Report ignorable fingerprints
        if: ${{ failure() && env.HAS_GITLEAKS_LICENSE == 'true' }}
        run: |
          [ -f results.sarif ] || exit 0
          fingerprints=$(jq -r '.runs[]?.results[]? | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.ruleId):\(.locations[0].physicalLocation.region.startLine)"' results.sarif 2>/dev/null | sort -u) || true
          [ -n "$fingerprints" ] || exit 0
          {
            echo '### What to do with these findings'
            echo
            echo 'If any of these is a real credential, rotate it now. It is already in this'
            echo 'branch history, and removing it in a later commit does not undo that.'
            echo
            echo 'Only for a confirmed false positive: add the matching line below to'
            echo '`.gitleaksignore` and commit it to this branch.'
            echo
            echo '```'
            echo "$fingerprints"
            echo '```'
            echo
            echo 'Do NOT paste the four-part `Fingerprint:` line from the job log. It names a'
            echo 'commit that the squash-merge discards, so it silences this pull request and'
            echo 'then fails the push scan of `master`.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
