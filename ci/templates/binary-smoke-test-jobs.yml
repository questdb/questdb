# Build the QuestDB distribution from source and smoke-test it: start the
# packaged server and run a query. This exercises the full from-source native
# build (Rust libquestdbr + the committed C++ lib) and the packaged runtime's
# native-lib loading from its own lib/ directory -- i.e. the exact artifact
# users download and run.
#
# The same job also runs the C++ glibc check: it dlopen()s the committed
# libquestdb.so inside an old-glibc container (amazonlinux:2 on x64,
# almalinux:8 on arm64) to confirm the prebuilt C++ library still loads on the
# oldest supported glibc. The Rust library is built from source on the host, so
# it always matches and needs no glibc check. Folding it into this job avoids a
# second checkout.
#
# Runs on self-hosted Linux boxes, which carry the Rust toolchain, a C
# compiler, and Docker. Both Linux architectures are checked: the aggregate jar
# and the arm64 Docker image ship linux-aarch64 natives, so the arm64 leg
# covers the from-source build and packaged runtime on that platform too.
jobs:
  - job: BuildAndSmokeTest
    displayName: "build + smoke test on"
    workspace:
      clean: all
    strategy:
      # Do NOT set JAVA_HOME here. Matrix variables are read-only at runtime, and
      # the Maven@3 task below (jdkVersionOption: 1.25) resolves the JDK from
      # JAVA_HOME_25_X64 and then sets JAVA_HOME itself -- overwriting a read-only
      # JAVA_HOME is rejected ("Overwriting readonly variable 'JAVA_HOME' is not
      # permitted"), which fails the build. The smoke-test step sets JAVA_HOME on
      # its own process env (from JAVA_HOME_25_X64) for the packaged questdb.sh.
      matrix:
        linux-x64:
          poolName: "hetzner-incus"
          JAVA_HOME_25_X64: "/opt/graalvm-25"
          glibcImage: "amazonlinux:2"
          libPath: "core/src/main/resources/io/questdb/bin/linux-x86-64/libquestdb.so"
        linux-arm64:
          poolName: "hetzner-incus-arm"
          JAVA_HOME_25_X64: "/opt/graalvm-25"
          glibcImage: "almalinux:8"
          libPath: "core/src/main/resources/io/questdb/bin/linux-aarch64/libquestdb.so"
    pool:
      name: $(poolName)
    timeoutInMinutes: 60
    # IsFork is unset on merge-queue and scheduled runs, so test for 'true' only.
    condition: ne(variables['System.PullRequest.IsFork'], 'true')
    variables:
      jdk: "1.25"
    steps:
      - checkout: self
        fetchDepth: 1
        lfs: false
        submodules: true
      # C++ glibc check: confirm the committed libquestdb.so loads on the oldest
      # supported glibc. Runs before the build so a glibc regression fails fast.
      - bash: |
          set -eux
          docker run --rm -v "$(Build.SourcesDirectory):/work" "$(glibcImage)" \
            bash /work/ci/glibc_load_check.sh "$(libPath)"
        displayName: "C++ glibc check: dlopen committed libquestdb on $(glibcImage)"
      - script: python3 .github/prepare_rust_env.py --export-cargo-install-env --match core/rust/qdbr/rust-toolchain.toml
        displayName: "Ensure Rust is installed"
      # When core pins a -SNAPSHOT questdb-client, build it from the submodule
      # (sets CLIENT_PROFILE=-P local-client); a released client is fetched from
      # Maven Central. Without this the build dies at dependency resolution:
      # questdb-client is a test-scoped dep, and -DskipTests skips only test
      # *execution*, not the test-compile classpath resolution, so a SNAPSHOT
      # client that is not on Central (built locally only) fails to resolve.
      - template: detect-local-client.yml
      - task: Maven@3
        displayName: "Build distribution (native libs from source)"
        inputs:
          mavenVersionOption: "$(MAVEN_VERSION_OPTION)"
          mavenPomFile: "pom.xml"
          mavenOptions: "$(MAVEN_OPTS)"
          goals: "clean package"
          options:
            "-pl core -am -DskipTests -Dhttp.keepAlive=false
            -P build-web-console,build-binaries $(CLIENT_PROFILE) $(MAVEN_RUN_OPTS)"
          jdkVersionOption: "$(jdk)"
      - bash: |
          set -eux
          archive="$(ls core/target/questdb-*-rt-*.gz 2>/dev/null | head -1)"
          if [ -z "$archive" ]; then
            echo "No rt-* distribution archive found in core/target"
            ls -la core/target
            exit 1
          fi
          bash ci/smoke_test_runtime_archive.sh "$archive"
        displayName: "Smoke test: start packaged server and run a query"
        env:
          # questdb.sh needs JAVA_HOME when the bundle ships without an embedded
          # JRE. JAVA_HOME is intentionally not a matrix variable (see above), so
          # set it on this step's process env from the per-leg JDK path.
          JAVA_HOME: $(JAVA_HOME_25_X64)
