# Installs sccache and points RUSTC_WRAPPER at it. Used by the hosted macOS/Windows Rust
# build jobs (rust-build-job.yml); run it after prepare_rust_env.py has installed the
# toolchain, because rustup cannot install a toolchain through the sccache wrapper.
steps:
  - bash: |
      set -eux
      SCCACHE_VERSION="0.10.0"

      export PATH="$(CARGO_INSTALL_PATH)/bin:$PATH"

      if [ "$(uname)" == "Darwin" ]; then
        SCCACHE_BINARY="sccache"
        ARCH="$(uname -m)"
        if [ "$ARCH" == "arm64" ]; then
          ARCHIVE="sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin.tar.gz"
        else
          ARCHIVE="sccache-v${SCCACHE_VERSION}-x86_64-apple-darwin.tar.gz"
        fi
      else
        SCCACHE_BINARY="sccache.exe"
        ARCHIVE="sccache-v${SCCACHE_VERSION}-x86_64-pc-windows-msvc.tar.gz"
      fi

      if [ -f "$(CARGO_INSTALL_PATH)/bin/${SCCACHE_BINARY}" ]; then
        echo "sccache already installed at: $(CARGO_INSTALL_PATH)/bin"
      else
        echo "Installing sccache ${SCCACHE_VERSION} for $(uname)..."

        URL="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${ARCHIVE}"
        echo "Downloading from: $URL"

        curl -L "$URL" -o sccache.tar.gz
        tar xzf sccache.tar.gz

        mkdir -p "$(CARGO_INSTALL_PATH)/bin"
        find . -name "${SCCACHE_BINARY}" | head -1 | xargs -I {} mv {} "$(CARGO_INSTALL_PATH)/bin/"

        rm -rf sccache.tar.gz sccache-v${SCCACHE_VERSION}-*

        echo "sccache installed successfully"
      fi

      sccache --version
      set +x  # workaround for https://github.com/microsoft/azure-pipelines-tasks/issues/10331
      echo "##vso[task.setvariable variable=RUSTC_WRAPPER]$(CARGO_INSTALL_PATH)/bin/${SCCACHE_BINARY}"
    displayName: "Install sccache"
    env:
      SCCACHE_AZURE_BLOB_CONTAINER: $(SCCACHE_AZURE_BLOB_CONTAINER)
      SCCACHE_AZURE_CONNECTION_STRING: $(SCCACHE_AZURE_CONNECTION_STRING)
