# One hosted macOS or Windows test job: a matrix of legs that run steps.yml against the Rust
# library their OS's build job published (rust-build-job.yml). The display name stays
# "on", so the check names ("Hosted Running tests on <leg>") are unchanged.
parameters:
  - name: name
    type: string
  - name: dependsOn
    type: string
  - name: prebuiltRustArtifact
    type: string
  - name: legs
    type: object

jobs:
  - job: ${{ parameters.name }}
    displayName: "on"
    # The default succeeded() condition skips the legs when the Rust build fails.
    dependsOn: ${{ parameters.dependsOn }}
    strategy:
      matrix: ${{ parameters.legs }}
    pool:
      vmImage: $(imageName)
      name: $(poolName)
    # 100, not 60: must stay above the 90-minute "Run tests" task ceiling passed to
    # steps.yml below, with headroom for the checkout/cache/compile steps that run
    # before it. A job ceiling at or below the task ceiling cancels the job before
    # the task's own timeout can report which step overran.
    timeoutInMinutes: 100
    variables:
      SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.SOURCE_CODE_CHANGED']]
      RUST_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.RUST_SOURCE_CODE_CHANGED']]
      COVERAGE_DIFF: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.COVERAGE_DIFF']]
      CODE_COVERAGE_TOOL_OPTION: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CODE_COVERAGE_TOOL_OPTION']]
      DIFF_COVER_THRESHOLD_PCT: 50
      ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).log"
      MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"
      # Hosted groups only run core-module tests; compile just core and its deps.
      TEST_REACTOR_ARGS: "-pl core -am"
    steps:
      - template: steps.yml
        parameters:
          prebuiltRustArtifact: ${{ parameters.prebuiltRustArtifact }}
          # Each run puts one OS on ADAPTIVE and the other on NOSYNC, and the next
          # run swaps them, so two consecutive runs give each OS both modes.
          testCommitModeGroup: "macOS Windows"
          testCommitModeMember: $(os)
          # 90, not the 55 default: the adaptive commit mode, which Windows runs
          # every other run, msyncs the sequencer log on every
          # transaction, and the hosted Windows agents pay the most for that. In
          # build 269349 windows-cairo-1, windows-cairo-2 and windows-fuzz2, all
          # on adaptive, hit the old cap (49 / 23 / 32
          # min on master) and every shard that did finish ran 1.5-1.8x its
          # master time. The matrix job is shared with macOS, so the cap rises
          # there too; it is a ceiling, not a target. When a Windows leg nears
          # 75-80 minutes, split another shard rather than raise this cap
          # (windows-cairo-3 and windows-fuzz3 came from that, Oct 2026).
          testTimeoutInMinutes: 90
