steps:
  - bash: python3 find_unterminated_logs.py core/src --exclude=LogParanoiaTest.java
    displayName: "Check for unterminated log statements"
  - bash: |
      set -eux
      # The diff base the coverage report uses: the base a merge-queue entry was built on, or the
      # PR's target branch. --depth=1 is enough: the check compares the two endpoint trees.
      if [[ "$BUILD_SOURCEBRANCH" =~ ^refs/heads/gh-readonly-queue/(.*)/pr-([0-9]+)-([0-9a-f]{40})$ ]]; then
        BASE_BRANCH="${BASH_REMATCH[1]}"
        DIFF_BASE="${BASH_REMATCH[3]}"
        # GitHub deletes the ref that made this commit reachable once that entry merges
        if ! git fetch --recurse-submodules=no --depth=1 origin "$DIFF_BASE"; then
          git fetch --recurse-submodules=no --depth=1 origin "$BASE_BRANCH"
          DIFF_BASE="origin/$BASE_BRANCH"
        fi
      elif [[ "$PR_NUMBER_MACRO" =~ ^[0-9]+$ ]]; then
        git fetch --recurse-submodules=no --depth=1 origin "$TARGET_BRANCH"
        DIFF_BASE="origin/$TARGET_BRANCH"
      else
        echo "Neither a PR nor a merge-queue build ($BUILD_SOURCEBRANCH); nothing to check"
        exit 0
      fi
      ci/check-type-dispatch.sh "$DIFF_BASE" HEAD
    displayName: "Check for new per-type dispatch"
    env:
      BUILD_SOURCEBRANCH: $(Build.SourceBranch)
      PR_NUMBER_MACRO: $(System.PullRequest.PullRequestNumber)
      TARGET_BRANCH: $(System.PullRequest.targetBranchName)
  - bash: |
      set -eux
      if [ -x /opt/intellij/idea/bin/idea.sh ]; then
        IDEA_HOME=/opt/intellij/idea
      else
        IDEA_ROOT="$(Build.SourcesDirectory)/.ci/intellij"
        rm -rf "$IDEA_ROOT"
        mkdir -p "$IDEA_ROOT"
        # Pinned: an unpinned "latest" download reformats the whole repo whenever
        # JetBrains ships a formatter change (2026.2 changed nested-ternary
        # continuation indents and turned every lint run red). Bump this pin and
        # reformat the repo in the same PR when moving to a newer IDEA
        wget "https://download.jetbrains.com/idea/idea-2026.1.4.tar.gz" -O intellij.tar.gz
        tar xzf intellij.tar.gz -C "$IDEA_ROOT"
        rm intellij.tar.gz
        cd "$IDEA_ROOT"
        ln -s idea-* idea
        IDEA_HOME="$IDEA_ROOT/idea"
      fi
      echo "IDEA_HOME: $IDEA_HOME"
      echo "JAVA_HOME: $JAVA_HOME"
      echo "java --version"
      "$JAVA_HOME/bin/java" --version
    displayName: "Install IntelliJ"
  - bash: |
      set -eux
      if [ -x /opt/intellij/idea/bin/idea.sh ]; then
        IDEA_BIN=/opt/intellij/idea/bin/idea.sh
      else
        IDEA_BIN="$(Build.SourcesDirectory)/.ci/intellij/idea/bin/idea.sh"
      fi
      "$IDEA_BIN" format -s .idea/codeStyles/Project.xml -m "*.java" -r .
    displayName: "Applying formatting"
  - bash: git submodule foreach --quiet 'git checkout -- . 2>/dev/null; git clean -fd 2>/dev/null' || true
    displayName: "Reset submodules after formatting"
  - bash: git status -s
    displayName: "List of affected files"
  - bash: git diff --exit-code
    displayName: "List of required changes"
