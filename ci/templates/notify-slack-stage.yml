# Alerts the builds Slack channel when a scheduled master run goes red. PR and manual runs
# never alert: their author watches them. The schedules use always: false, so Azure starts a
# run only when master moved since the last green scheduled run; a red master therefore
# reruns, and alerts again, every slot until someone fixes it.
#
# The webhook is the BUILDS_SLACK_HOOK_URL secret variable, set in the pipeline settings UI.
# Until it is set, the job skips cleanly.
parameters:
  # What the run tests, for the alert's title: the definitions' names say little
  # ("New pull request").
  - name: title
    type: string
  # Every stage that runs on the schedule.
  - name: dependsOn
    type: object

stages:
  - stage: NotifyOnFailure
    displayName: "Notify Slack on failure"
    dependsOn: ${{ parameters.dependsOn }}
    # not(succeeded()) rather than failed(): a timed-out job reports canceled, not failed.
    condition: and(not(succeeded()), eq(variables['Build.Reason'], 'Schedule'))
    jobs:
      - job: NotifyOnFailure
        displayName: "Notify Slack on failure"
        pool: hetzner-incus
        steps:
          - checkout: none
          - bash: |
              # While the secret variable is missing from the pipeline settings, the env
              # mapping below passes the macro through unexpanded; skip instead of
              # curl-ing a literal "$(...)".
              case "$BUILDS_SLACK_HOOK_URL" in
                '' | '$('*)
                  echo "BUILDS_SLACK_HOOK_URL is not configured; skipping Slack alert"
                  exit 0
                  ;;
              esac
              curl -sS --fail -X POST -H 'Content-type: application/json' \
                --data '{"text":"🚨 *master is red: ${{ parameters.title }} (OSS)*\n\nBuild: <$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)|#$(Build.BuildId)> (its Changes tab lists the commits since the previous run)\nCommit: <https://github.com/questdb/questdb/commits/$(Build.SourceVersion)|$(Build.SourceVersion)>"}' \
                "$BUILDS_SLACK_HOOK_URL"
            displayName: "Notify Slack on failure"
            env:
              BUILDS_SLACK_HOOK_URL: $(BUILDS_SLACK_HOOK_URL)
