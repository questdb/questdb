jobs:
  - job: RunOn
    displayName: "on"
    strategy:
      matrix:
        linux-jdk25:
          poolName: hetzner-incus
          os: Linux
          jdk: "1.25"
    pool:
      vmImage: $(imageName)
      name: $(poolName)
    timeoutInMinutes: 55
    variables:
      SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_changes.SOURCE_CODE_CHANGED']]
      RUST_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.RUST_SOURCE_CODE_CHANGED']]
      COVERAGE_DIFF: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.COVERAGE_DIFF']]
      CODE_COVERAGE_TOOL_OPTION: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CODE_COVERAGE_TOOL_OPTION']]
      ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).log"
    steps:
      - checkout: self
        fetchDepth: 1
        lfs: false
        submodules: false
      - bash: |
          JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
          echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
          echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
          echo "JAVA_HOME will be set to: $JAVA_PATH"
        displayName: "Activate JDK 25 (openjdk amd64)"
      - template: detect-local-client.yml

      - bash: python3 ci/test_configure_hetzner_apt_mirrors.py
        displayName: "Test Hetzner APT mirror configuration"

      - template: java-lint.yml

      # Rust lint and test
      - template: rust-test-and-lint.yml
        parameters:
          shouldRun: eq(variables['RUST_SOURCE_CODE_CHANGED'], 'true')

      # Compat tests
      - template: compat-steps.yml

      # Javadoc
      - task: Maven@3
        displayName: "Javadoc"
        inputs:
          mavenVersionOption: "$(MAVEN_VERSION_OPTION)"
          mavenDirectory: '$(build.sourcesdirectory)/maven/apache-maven-$(MAVEN_VERSION)'
          mavenPomFile: "pom.xml"
          mavenOptions: "$(MAVEN_OPTS)"
          options:
            "-s $(MAVEN_SETTINGS_FILE) compile javadoc:javadoc -DskipTests -P javadoc -P qdbr-release $(CLIENT_PROFILE) $(MAVEN_RUN_OPTS)"
          jdkVersionOption: $(jdk)

      # Check bytecode size
      - bash: |
          JAR_FILE=$(find core/target -maxdepth 1 -name "questdb-*.jar" ! -name "*-tests.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
          if [[ -z "$JAR_FILE" ]]; then
            echo "Error: No QuestDB JAR file found in core/target"
            exit 1
          fi
          echo "Checking JAR: $JAR_FILE"
          ./ci/check-bytecode-size.sh --jar "$JAR_FILE" --threshold 8000
        displayName: "Check bytecode size"

  # Native JIT tests. core/CMakeLists.txt gates the jittests target behind JIT_TEST, which defaults
  # to FALSE, so the asmjit-based tests covering the scalar and four-lane filter backends in
  # core/src/main/c/share/jit built nowhere and ran nowhere. The binary exits non-zero when a case
  # fails, so running it is the gate.
  #
  # A separate job rather than another step in RunOn: the build compiles the whole questdb library
  # (asmjit is embedded, so its translation units are compiled twice) plus liburing, which is 10-20
  # minutes this stage would otherwise spend serially, and it writes into
  # core/target/classes/io/questdb/bin-local, where a locally built libquestdb.so SHADOWS the
  # committed one (io/questdb/std/Os.java). Its own workspace keeps both problems out of the lint
  # job. The gate covers the native side only - a Java-only change to CompiledFilterIRSerializer
  # does not set the flag, by design, since test_app.cpp builds its own IR and runs no Java.
  - job: NativeJitTests
    displayName: "Native JIT tests"
    pool: hetzner-incus
    timeoutInMinutes: 30
    variables:
      CXX_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CXX_SOURCE_CODE_CHANGED']]
    steps:
      - checkout: self
        fetchDepth: 1
        lfs: false
        submodules: false
      - template: use-hetzner-apt-mirrors.yml
        parameters:
          shouldRun: and(succeeded(), eq(variables['CXX_SOURCE_CODE_CHANGED'], 'true'))
      - bash: |
          set -eux
          # gcc is already present (the core and Rust builds need it); add cmake and nasm (the
          # x86-64 asmlib) only when missing, as the client native build does.
          if ! command -v cmake >/dev/null 2>&1 || ! command -v nasm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y cmake nasm build-essential
          fi
          # The library embeds jni.h from JAVA_HOME.
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-25-openjdk-amd64}"
          # This job checks out without submodules; the questdb library the tests link needs these.
          # ci/submodule-update.sh authenticates the clones when it can (GH_TOKEN, or
          # the checkout task's persisted credential) and retries with backoff when
          # it cannot; fork PR builds never receive GIT_GITHUB_TOKEN because Azure
          # withholds secret variables from forks.
          bash ci/submodule-update.sh \
            core/src/main/c/share/zlib \
            core/src/main/c/share/fsst \
            core/src/main/c/share/simdjson \
            core/src/main/c/share/jemalloc
          cd core
          # The static-library link step writes here and does not create the directory itself.
          mkdir -p target/classes/io/questdb/bin-local
          cmake -B build/jittest -DCMAKE_BUILD_TYPE=Release -DJIT_TEST=TRUE
          # An explicit job count: a bare --parallel passes make an unbounded -j, and this graph is
          # ~190 objects including four -O3 SIMD variants and the simdjson amalgamation.
          cmake --build build/jittest --target jittests --parallel "$(nproc)"
          ./target/classes/io/questdb/bin-local/jittests
        displayName: "Build and run native JIT tests (jittests)"
        env:
          GH_TOKEN: $(GIT_GITHUB_TOKEN)
        condition: and(succeeded(), eq(variables['CXX_SOURCE_CODE_CHANGED'], 'true'))
      - bash: |
          set -ux
          # Leave no locally built library behind: bin-local shadows the committed one for any JVM
          # that later runs off this workspace, and zlib's CMakeLists renames zconf.h in the SOURCE
          # tree, which dirties the submodule.
          rm -rf "$(Build.SourcesDirectory)/core/target/classes/io/questdb/bin-local"
          rm -rf "$(Build.SourcesDirectory)/core/questdb"
          git -C "$(Build.SourcesDirectory)/core/src/main/c/share/zlib" checkout -- . || true
        displayName: "Clean native build artifacts"
        condition: eq(variables['CXX_SOURCE_CODE_CHANGED'], 'true')
