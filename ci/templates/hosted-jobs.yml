jobs:
  - job: RunOn
    displayName: "on"
    strategy:
      matrix:
        windows-griffin-base:
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          includeTests: "**/griffin/*"
          # Exclude O3 tests: run in windows-other-2
          # Exclude Fuzz tests: run in windows-fuzz1 (cairo) and windows-fuzz2 (non-cairo)
          excludeTests: "**/O3*Test**,**/**Fuzz**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-griffin-sub:
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          includeTests: "**/griffin/**/*"
          # Exclude O3 tests: run in windows-other-2
          # Exclude Fuzz tests: run in windows-fuzz1 (cairo) and windows-fuzz2 (non-cairo)
          # Exclude base package: run in windows-griffin-base
          excludeTests: "**/griffin/*,**/O3*Test**,**/**Fuzz**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-fuzz1:
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          includeTests: "**/cairo/fuzz/**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-fuzz2:
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          includeTests: "**/**Fuzz**"
          # Exclude cairo fuzz tests: run in windows-fuzz1
          excludeTests: "**/cairo/fuzz/**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-cairo-1:
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          includeTests: "**/cairo/**"
          # Exclude O3 tests: run in windows-other-2
          # Exclude Fuzz tests: run in windows-fuzz1 (cairo/fuzz) and windows-fuzz2 (other fuzz)
          # Exclude mv/o3 subdirs: run in windows-cairo-2
          excludeTests: "**/O3*Test**,**/**Fuzz**,**/cairo/mv/**,**/cairo/o3/**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-cairo-2:
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          includeTests: "**/cairo/mv/**,**/cairo/o3/**"
          # Exclude Fuzz tests: run in windows-fuzz2
          excludeTests: "**/**Fuzz**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-pgwire:
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          includeTests: "**/pgwire/**/*.java"
          # Exclude O3 tests: run in windows-other-2
          # Exclude Fuzz tests: run in windows-fuzz2
          excludeTests: "**/O3*Test**,**/**Fuzz**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-other-1:
          # No WEB_CONSOLE_PROFILE override: this group runs ServerMainTest, whose
          # testServerUpgradeDoesNotOverrideWebConsoleConfig needs the bundled web
          # console, so it inherits the default build-web-console profile.
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          # Exclude griffin: run in windows-griffin-base and windows-griffin-sub
          # Exclude cairo: run in windows-cairo-1, windows-cairo-2, windows-fuzz1
          # Exclude compat/cliutil: run in Linux (JavaAndRustLint stage)
          # Exclude pgwire: run in windows-pgwire
          # Exclude cutlass/http, cutlass/qwp, cutlass/text: run in windows-other-2
          # Exclude Fuzz tests: run in windows-fuzz1 and windows-fuzz2
          # Exclude O3 tests: run in windows-other-2
          excludeTests: "**/griffin/**,**/cairo/**,**/compat/**,**/cliutil/**,**/pgwire/**,**/cutlass/http/**,**/cutlass/qwp/**,**/cutlass/text/**,**/**Fuzz**,**/O3*Test**"
          javadoc_step: ""
          javadoc_profile: ""
        windows-other-2:
          # No test here needs the bundled web console (ServerMainTest runs in
          # windows-other-1), so skip the build-web-console download.
          WEB_CONSOLE_PROFILE: ""
          imageName: "windows-latest"
          poolName: "Azure Pipelines"
          os: Windows
          jdk: "1.25"
          testset: "all"
          # Heavier cutlass groups (http, qwp, text) plus O3 tests; balances wall-clock with windows-other-1
          includeTests: "**/cutlass/http/**,**/cutlass/qwp/**,**/cutlass/text/**,**/O3*Test**"
          # Exclude Fuzz tests: run in windows-fuzz2
          # Exclude cairo/o3 and cairo/mv: run in windows-cairo-2
          excludeTests: "**/**Fuzz**,**/cairo/o3/**,**/cairo/mv/**"
          javadoc_step: ""
          javadoc_profile: ""

    pool:
      vmImage: $(imageName)
      name: $(poolName)
    timeoutInMinutes: 60
    variables:
      SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.SOURCE_CODE_CHANGED']]
      RUST_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.RUST_SOURCE_CODE_CHANGED']]
      COVERAGE_DIFF: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.COVERAGE_DIFF']]
      CODE_COVERAGE_TOOL_OPTION: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CODE_COVERAGE_TOOL_OPTION']]
      DIFF_COVER_THRESHOLD_PCT: 50
      ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).log"
      MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"
      # Hosted groups only run core-module tests; compile just core and its deps.
      TEST_REACTOR_ARGS: "-pl core -am"
    steps:
      - template: steps.yml

  # macOS aarch64 on the "GitHub-hosted Agents" pool (Apple Silicon).
  # The regular Microsoft-hosted macOS images (macOS-14/15/26) are Intel x64;
  # the arm64 preview of those is paused. Apple Silicon is therefore only
  # reachable through this pool, which bills per minute (pay-as-you-go) rather
  # than consuming a parallel job. Standard spec is 3 vCPU / 7 GB.
  # The self-hosted "m1" pool is not an option here: it is not authorised for
  # the "questdb" project that runs these pipelines.
  - job: macos_aarch64
    workspace:
      clean: all
    displayName: "on macos-aarch64"
    pool:
      name: "GitHub-hosted Agents"
      vmImage: "macos-26-arm64"
    timeoutInMinutes: 60
    condition: ne(variables['System.PullRequest.IsFork'], 'true')
    variables:
      SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.SOURCE_CODE_CHANGED']]
      RUST_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.RUST_SOURCE_CODE_CHANGED']]
      COVERAGE_DIFF: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.COVERAGE_DIFF']]
      CODE_COVERAGE_TOOL_OPTION: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CODE_COVERAGE_TOOL_OPTION']]
      DIFF_COVER_THRESHOLD_PCT: 50
      ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).log"
      MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"
      TEST_REACTOR_ARGS: "-pl core -am"
      WEB_CONSOLE_PROFILE: ""
      os: macOS
      poolName: "GitHub-hosted Agents"
      jdk: "1.25"
      testset: "all"
      # Start with the cairo shard; widen once the pool is proven green.
      includeTests: "**/cairo/**"
      excludeTests: "**/cairo/fuzz/**"
      javadoc_step: ""
      javadoc_profile: ""
    steps:
      # Fail fast if the agent is not really arm64. "macos-14" means arm64 on
      # GitHub Actions but Intel on Azure's hosted images, so never infer the
      # architecture from a pool or image label -- assert it.
      # steps.yml keys JDK activation off the hetzner-* pool names, so none of
      # those fire here; resolve JAVA_HOME from the agent instead.
      - bash: |
          set -eu
          echo "arch  : $(uname -m)"
          echo "os    : $(sw_vers -productVersion)"
          echo "cores : $(sysctl -n hw.ncpu)   mem: $(sysctl -n hw.memsize)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: expected arm64, got $(uname -m)"
            exit 1
          fi
          JAVA_PATH="${JAVA_HOME_25_ARM64:-}"
          if [ -z "$JAVA_PATH" ]; then
            JAVA_PATH="$(/usr/libexec/java_home -v 25 2>/dev/null || true)"
          fi
          if [ -z "$JAVA_PATH" ]; then
            echo "ERROR: no JDK 25 on the image; available:"
            /usr/libexec/java_home -V 2>&1 || true
            exit 1
          fi
          echo "JAVA_HOME: $JAVA_PATH"
          echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
          echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
        displayName: "Assert arm64 and activate JDK 25"
      - template: steps.yml