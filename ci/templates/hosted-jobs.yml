jobs:
  # Temporary crash reproducer. Keep most runs identical to the failing shard:
  # diagnostic VM options can perturb allocation order and mask a rare crash.
  - job: MacGriffinSubBaseline
    displayName: "mac-griffin-sub baseline"
    strategy:
      parallel: 12
    pool:
      vmImage: "macos-14"
      name: "Azure Pipelines"
    timeoutInMinutes: 60
    variables:
      WEB_CONSOLE_PROFILE: ""
      poolName: "Azure Pipelines"
      os: macOS
      jdk: "1.25"
      testset: "all"
      includeTests: "**/griffin/**/*"
      excludeTests: "**/griffin/*,**/griffin/fuzz/**,**/griffin/**/*Fuzz*"
      javadoc_step: ""
      javadoc_profile: ""
      SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.SOURCE_CODE_CHANGED']]
      RUST_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.RUST_SOURCE_CODE_CHANGED']]
      COVERAGE_DIFF: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.COVERAGE_DIFF']]
      CODE_COVERAGE_TOOL_OPTION: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CODE_COVERAGE_TOOL_OPTION']]
      DIFF_COVER_THRESHOLD_PCT: 50
      ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-baseline-$(System.JobPositionInPhase)-$(Build.SourceVersion).log"
      MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"
      TEST_REACTOR_ARGS: "-pl core -am"
    steps:
      - template: steps.yml

  # VerifyBeforeGC is the useful discriminator: it can catch a bad oop before
  # ParallelGC mutates the heap. Before+During+After exhausted the 55-minute cap.
  - job: MacGriffinSubVerified
    displayName: "mac-griffin-sub pre-GC verified"
    strategy:
      parallel: 4
    pool:
      vmImage: "macos-14"
      name: "Azure Pipelines"
    timeoutInMinutes: 60
    variables:
      WEB_CONSOLE_PROFILE: ""
      poolName: "Azure Pipelines"
      os: macOS
      jdk: "1.25"
      testset: "all"
      includeTests: "**/griffin/**/*"
      excludeTests: "**/griffin/*,**/griffin/fuzz/**,**/griffin/**/*Fuzz*"
      javadoc_step: ""
      javadoc_profile: ""
      SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.SOURCE_CODE_CHANGED']]
      RUST_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.RUST_SOURCE_CODE_CHANGED']]
      COVERAGE_DIFF: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.COVERAGE_DIFF']]
      CODE_COVERAGE_TOOL_OPTION: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CODE_COVERAGE_TOOL_OPTION']]
      DIFF_COVER_THRESHOLD_PCT: 50
      ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-verified-$(System.JobPositionInPhase)-$(Build.SourceVersion).log"
      CRASH_REPRO_JAVA_TOOL_OPTIONS: >-
        -XX:+UnlockDiagnosticVMOptions
        -XX:+VerifyBeforeGC
        -XX:+CheckJNICalls
        -Xlog:gc+verify=debug,safepoint=info:file=$(Build.ArtifactStagingDirectory)/gc-verified-$(System.JobPositionInPhase)-pid%p.log:time,uptime,level,tags
      MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"
      TEST_REACTOR_ARGS: "-pl core -am"
    steps:
      - template: steps.yml
        parameters:
          javaToolOptions: "$(CRASH_REPRO_JAVA_TOOL_OPTIONS)"
      - task: PublishBuildArtifacts@1
        displayName: "Upload GC verification logs"
        condition: always()
        continueOnError: true
        inputs:
          pathToPublish: "$(Build.ArtifactStagingDirectory)"
          artifactName: "mac-griffin-sub-verified-$(System.JobPositionInPhase)"
