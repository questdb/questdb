# Also run in the GitHub merge queue: CI trigger on the ephemeral merge-queue branches.
trigger:
  branches:
    include:
      - gh-readonly-queue/*

pr:
  branches:
    include:
      - master
  drafts: false

variables:
  QDB_LOG_W_FILE_LOCATION: "$(Build.BinariesDirectory)/tests.log"
  ARCHIVED_LOGS: "$(Build.ArtifactStagingDirectory)/questdb-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).zip"
  DIFF_COVER_THRESHOLD_PCT: 50
  excludeTests: ""
  includeTests: "%regex[.*[^o].class]"
  MAVEN_CACHE_FOLDER: $(HOME)/.m2/repository
  MAVEN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx3g -XX:+UseParallelGC"
  # Cache connect resilience. The self-hosted Reposilite cache is a single IP reached over
  # the Hetzner vSwitch; under the fleet's cold-build connection bursts a fraction of TCP
  # SYNs to it are dropped, and the failover-less mirror turns one black-holed connect into
  # a dead build ("Connect to maven.internal:8081 ... Connection timed out").
  #   * retryHandler.count=3 retries failed resolves, BUT wagon's default retry handler puts
  #     ConnectException (and other connect-phase errors) on its non-retryable list, so a
  #     connect-phase failure was NOT actually retried. nonRetryableClasses overrides that
  #     default set with a single never-thrown class, which re-enables retry on connect
  #     failures (the case we actually hit). connectionTimeout (in maven-settings-hetzner.xml)
  #     bounds each connect attempt to ~10s instead of the ~127s OS SYN-retransmit budget, so
  #     a retried connect re-attempts on a fresh source port instead of hanging out the build.
  # The cache-box fix (nginx front-end + enlarged upstream keepalive pool) reduces the drop
  # rate at the source; these client flags are the backstop for any residual lost SYN.
  MAVEN_RUN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Dmaven.resolver.transport=wagon -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.nonRetryableClasses=java.io.NotSerializableException "
  MAVEN_VERSION: "version"
  MAVEN_VERSION_OPTION: "Default"
  # Full-reactor defaults for the self-hosted Linux jobs. The hosted mac/windows
  # jobs run on demand in test-hosted-pipeline.yml, not here.
  TEST_REACTOR_ARGS: ""
  WEB_CONSOLE_PROFILE: "-P build-web-console"

stages:
  - stage: CheckChanges
    displayName: "Check Changes"
    jobs:
      - template: templates/check-changes-job.yml

  - stage: TriggerEnterpriseCI
    displayName: "Trigger Enterprise CI"
    # An explicit condition drops the implicit succeeded(), so restore it: a queue build
    # whose CheckChanges stage failed must not post a real enterprise run.
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'true'))
    dependsOn:
      - CheckChanges
    jobs:
      - job: TriggerEnterprise
        displayName: "Trigger Enterprise Pipeline"
        pool: hetzner-incus
        variables:
          SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.SOURCE_CODE_CHANGED']]
        # A PR or merge-queue build triggers enterprise CI even when no source path changed:
        # enterprise-ci is a required check, so GitHub blocks a PR that never reports it from
        # joining the queue, and ejects a queue entry that never reports it.
        condition: >-
          or(eq(variables['SOURCE_CODE_CHANGED'], 'true'),
          eq(variables['Build.Reason'], 'PullRequest'),
          startsWith(variables['Build.SourceBranch'], 'refs/heads/gh-readonly-queue/'))
        steps:
          - checkout: none
          - bash: |
              set -e
              # Trigger the enterprise CI pipeline via Azure DevOps REST API
              AUTH_HEADER="Authorization: Basic $(printf ':%s' "$AZURE_DEVOPS_ENT_PAT" | base64 -w0)"

              # Read one field of an OSS pull request. Prints an empty string when the PR does
              # not exist or the API call fails, so a transient GitHub error can never reach the
              # payload as the literal string "null".
              gh_pr_field() {
                curl -sS --max-time 30 --retry 3 --retry-delay 2 --retry-connrefused \
                  -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/questdb/questdb/pulls/$1" \
                  | jq -r "$2 // empty"
              }

              if [[ "$OSS_PR_NUMBER" =~ ^[0-9]+$ ]]; then
                # PR build: Azure builds an ephemeral merge commit, not the PR head.
                # Fetch the real PR head commit from the GitHub API.
                OSS_COMMIT=$(gh_pr_field "$OSS_PR_NUMBER" '.head.sha')
                echo "PR build for PR #$OSS_PR_NUMBER; head commit $OSS_COMMIT"
              elif [[ "$BUILD_SOURCEBRANCH" =~ ^refs/heads/gh-readonly-queue/.*/pr-([0-9]+)- ]]; then
                # Merge-queue build: branch is refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>.
                # Test the merge commit itself (PR merged with latest master); recover the PR
                # number from the branch name and the PR source branch from the GitHub API.
                OSS_PR_NUMBER="${BASH_REMATCH[1]}"
                OSS_COMMIT="$BUILD_SOURCEVERSION"
                OSS_BRANCH=$(gh_pr_field "$OSS_PR_NUMBER" '.head.ref')
                echo "Merge-queue build for PR #$OSS_PR_NUMBER; merge commit $OSS_COMMIT; source branch $OSS_BRANCH"
              else
                # Manual or scheduled run: there is no PR to test enterprise against.
                echo "Neither a PR nor a merge-queue build ($BUILD_SOURCEBRANCH); skipping enterprise CI"
                exit 0
              fi

              if [ -z "$OSS_COMMIT" ]; then
                echo "##vso[task.logissue type=error]Could not resolve the OSS commit for PR #$OSS_PR_NUMBER"
                exit 1
              fi

              # Check if matching branch exists in enterprise repo (private, requires auth).
              # An unreachable API falls back to main rather than failing the build.
              ENT_BRANCH="main"
              if [ -n "$OSS_BRANCH" ]; then
                BRANCH_CHECK=$(curl -sS --max-time 30 --retry 3 --retry-delay 2 --retry-connrefused \
                  -o /dev/null -w "%{http_code}" \
                  -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/questdb/questdb-enterprise/branches/$OSS_BRANCH" || echo "000")
                if [ "$BRANCH_CHECK" = "200" ]; then
                  ENT_BRANCH="$OSS_BRANCH"
                fi
              fi
              echo "Enterprise branch: $ENT_BRANCH (OSS branch '$OSS_BRANCH')"

              PAYLOAD=$(cat <<EOF
              {
                "resources": {
                  "repositories": {
                    "self": {
                      "refName": "refs/heads/$ENT_BRANCH"
                    }
                  }
                },
                "templateParameters": {
                  "ossCommit": "$OSS_COMMIT",
                  "ossPrNumber": "$OSS_PR_NUMBER"
                }
              }
              EOF
              )

              echo "Triggering enterprise CI for commit $OSS_COMMIT (PR #$OSS_PR_NUMBER)"

              HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
                -H "$AUTH_HEADER" \
                -H "Content-Type: application/json" \
                "https://dev.azure.com/questdb/questdb-enterprise/_apis/pipelines/23/runs?api-version=7.0" \
                -d "$PAYLOAD")

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                RUN_ID=$(jq -r '.id // empty' response.json)
                echo "Triggered enterprise CI: https://dev.azure.com/questdb/questdb-enterprise/_build/results?buildId=$RUN_ID"
              else
                echo "##vso[task.logissue type=warning]Failed to trigger enterprise CI (HTTP $HTTP_CODE); see pipeline logs"
                rm -f response.json
                exit 1
              fi
              rm -f response.json
            displayName: "Trigger Enterprise Pipeline"
            env:
              AZURE_DEVOPS_ENT_PAT: $(AZURE_DEVOPS_ENT_PAT)
              GH_TOKEN: $(GH_TOKEN)
              OSS_PR_NUMBER: $(System.PullRequest.PullRequestNumber)
              OSS_BRANCH: $(System.PullRequest.SourceBranch)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)

  - stage: SelfHostedRunGriffin
    displayName: "SelfHosted Griffin tests"
    condition: ne(variables['System.PullRequest.IsFork'], 'true')
    dependsOn:
      - CheckChanges
    jobs:
      - template: templates/self-hosted-jobs.yml
    variables:
      includeTests: "**/griffin/**"

  - stage: SelfHostedRunCairoA
    displayName: "SelfHosted Cairo tests (A)"
    condition: ne(variables['System.PullRequest.IsFork'], 'true')
    dependsOn:
      - CheckChanges
    jobs:
      - template: templates/self-hosted-jobs.yml
    variables:
      includeTests: "**/cairo/*,**/cairo/fuzz/**"

  - stage: SelfHostedRunCairoB
    displayName: "SelfHosted Cairo tests (B)"
    condition: ne(variables['System.PullRequest.IsFork'], 'true')
    dependsOn:
      - CheckChanges
    jobs:
      - template: templates/self-hosted-jobs.yml
    variables:
      includeTests: "**/cairo/o3/**,**/cairo/wal/**,**/cairo/mv/**,**/cairo/map/**,**/cairo/pool/**,**/cairo/view/**,**/cairo/vm/**,**/cairo/file/**,**/cairo/sql/**"

  - stage: SelfHostedRunOtherA
    displayName: "SelfHosted Other tests (A)"
    condition: ne(variables['System.PullRequest.IsFork'], 'true')
    dependsOn:
      - CheckChanges
    jobs:
      - template: templates/self-hosted-jobs.yml
    variables:
      includeTests: "**/cutlass/pgwire/**,**/cutlass/http/**,**/std/*,**/std/str/**,**/std/datetime/microtime/**,**/std/fastdouble/**,**/std/bytes/**,**/log/**,**/sqllogictest/*,**/network/**"

  - stage: SelfHostedRunOtherB
    displayName: "SelfHosted Other tests (B)"
    condition: ne(variables['System.PullRequest.IsFork'], 'true')
    dependsOn:
      - CheckChanges
    jobs:
      - template: templates/self-hosted-jobs.yml
    variables:
      excludeTests: "**/griffin/**,**/cairo/**,**/cutlass/pgwire/**,**/cutlass/http/**,**/std/*,**/std/str/**,**/std/datetime/microtime/**,**/std/fastdouble/**,**/std/bytes/**,**/log/**,**/sqllogictest/*,**/network/**"

  - stage: SelfHostedRunTestsCoverageBranches
    displayName: "SelfHosted Running tests with cover"
    dependsOn:
      - CheckChanges
    jobs:
      - template: templates/self-hosted-cover-jobs.yml

  - stage: JavaAndRustLint
    displayName: "Rust Test and Lint"
    dependsOn:
      - CheckChanges
    jobs:
      - template: templates/aux-job.yml

  - stage: CoverageReports
    displayName: "Coverage Report"
    dependsOn:
      - CheckChanges
      - SelfHostedRunTestsCoverageBranches
    jobs:
      - job: CoverageReport
        displayName: "Coverage Report"
        pool: hetzner-incus
        variables:
          RUST_SOURCE_CODE_CHANGED: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.RUST_SOURCE_CODE_CHANGED']]
          CODE_COVERAGE_TOOL_OPTION: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.CODE_COVERAGE_TOOL_OPTION']]
          COVERAGE_DIFF: $[stageDependencies.CheckChanges.CheckChanges.outputs['check_coverage.COVERAGE_DIFF']]
          SHOULD_RUN: $[ and( or( eq(variables['RUST_SOURCE_CODE_CHANGED'], 'true'), eq(variables['CODE_COVERAGE_TOOL_OPTION'], 'JaCoCo') ), eq(variables['System.PullRequest.IsFork'], 'false') )]
          jdk: "1.25"

        # Coverage Job is required to run by a validation rule, but there's no point in running the steps
        # if there were no code changes. Therefore we define SHOULD_RUN and use it as a condition in all steps.
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
            persistCredentials: true
          - template: templates/use-hetzner-apt-mirrors.yml
            parameters:
              shouldRun: and(succeeded(), eq(variables['SHOULD_RUN'], 'true'))
          - bash: |
              sudo apt-get update && sudo apt-get install -y openjdk-25-jdk maven
              JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
              echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
            displayName: "Install JDK and Maven"
            condition: eq(variables['SHOULD_RUN'], 'true')
          - template: templates/detect-local-client.yml
          - bash: |
              if curl -sf --connect-timeout 2 http://maven.internal:8081/ > /dev/null 2>&1; then
                echo "Private Reposilite cache reachable, using hetzner maven settings"
                echo "##vso[task.setvariable variable=MAVEN_SETTINGS_FILE]$(Build.SourcesDirectory)/ci/maven-settings-hetzner.xml"
                # Allow HTTP keep-alive when routing through the private Reposilite cache.
                # -Dhttp.keepAlive=false opens a new TCP connection per artifact; the single-IP cache
                # reached over the Hetzner vSwitch can't absorb that connection churn under concurrent
                # builds (intermittent "Connect to maven.internal:8081 ... Connection timed out", which
                # the failover-less mirror turns into a build failure). Reusing connections avoids it.
                echo "##vso[task.setvariable variable=MAVEN_KEEPALIVE_OPT]"
              else
                echo "Private Reposilite not reachable, using default maven settings"
                echo "##vso[task.setvariable variable=MAVEN_SETTINGS_FILE]$(Build.SourcesDirectory)/ci/maven-settings.xml"
                # Direct-to-Central path: keep historical behaviour (no connection reuse).
                echo "##vso[task.setvariable variable=MAVEN_KEEPALIVE_OPT]-Dhttp.keepAlive=false"
              fi
            displayName: "Select Maven settings (local proxy vs default)"
          - download: current
            artifact: jacoco-coverage
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['CODE_COVERAGE_TOOL_OPTION'], 'JaCoCo'))
          - download: current
            artifact: rust-llvm-coverage
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['RUST_SOURCE_CODE_CHANGED'], 'true'))
          - task: Cache@2
            continueOnError: true
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['CODE_COVERAGE_TOOL_OPTION'], 'JaCoCo'))
            inputs:
              key: '"questdb_main" | "maven"'
              path: $(MAVEN_CACHE_FOLDER)

          - task: Maven@3
            displayName: "Compile with Maven"
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['CODE_COVERAGE_TOOL_OPTION'], 'JaCoCo'))
            inputs:
              mavenPomFile: "pom.xml"
              mavenOptions: "$(MAVEN_OPTS)"
              goals: "compile"
              options: "-s $(MAVEN_SETTINGS_FILE) --batch-mode -pl core -am -DskipTests $(CLIENT_PROFILE) -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) $(MAVEN_KEEPALIVE_OPT)"
              jdkVersionOption: $(jdk)

          - task: Maven@3
            displayName: "Merge partial JaCoCo reports"
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['CODE_COVERAGE_TOOL_OPTION'], 'JaCoCo'))
            inputs:
              mavenPomFile: "ci/jacoco-merge.xml"
              goals: "verify"
              options:
                "-s $(MAVEN_SETTINGS_FILE) --batch-mode $(MAVEN_KEEPALIVE_OPT) -DincludeRoot=$(Pipeline.Workspace)
                -DoutputDirectory=$(Pipeline.Workspace)/jacoco-aggregate
                -DcoverDiff=$(COVERAGE_DIFF)
                -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)"
              jdkVersionOption: $(jdk)

          - bash: |
              set -eux
              COVERAGE_DIR=$(Pipeline.Workspace)/rust-llvm-coverage
              ls -al $COVERAGE_DIR

              # Concatenate all partial LCOV files into a single file
              LCOV_FILES=$(find "$COVERAGE_DIR" -name '*.lcov' -type f)
              if [ -z "$LCOV_FILES" ]; then
                echo "No LCOV files found in $COVERAGE_DIR"
                exit 1
              fi
              cat $LCOV_FILES > questdbr-combined.lcov.dat

              # Merge LCOV coverage results, normalizing paths from different build agents
              python3 ./ci/merge_lcov_paths.py questdbr-combined.lcov.dat questdbr-patched.lcov.dat

              # Convert LCOV coverage results to Cobertura XML format
              python3 ./ci/lcov_cobertura.py questdbr-patched.lcov.dat --output cobertura.xml --base-dir core/rust
            displayName: "Merge partial Rust reports"
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['RUST_SOURCE_CODE_CHANGED'], 'true'))

          - task: PublishBuildArtifacts@1
            displayName: "Upload Rust coverage report"
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['RUST_SOURCE_CODE_CHANGED'], 'true'))
            inputs:
              pathToPublish: "$(Build.SourcesDirectory)/cobertura.xml"
              artifactName: "rust-coverage"

          - task: PublishBuildArtifacts@1
            displayName: "Upload merged JaCoCo report"
            condition: and(eq(variables['SHOULD_RUN'], 'true'), eq(variables['CODE_COVERAGE_TOOL_OPTION'], 'JaCoCo'))
            inputs:
              pathToPublish: "$(Pipeline.Workspace)/jacoco-aggregate/jacoco.xml"
              artifactName: "jacoco-merged-coverage-report"

          - bash: |
              set -eux
              COVER_ARGS=""
              for f in "$(Pipeline.Workspace)/jacoco-aggregate/jacoco.xml"; do
                [ -f "$f" ] && COVER_ARGS="-type jacoco --cover $f"
              done
              [ -f cobertura.xml ] && COVER_ARGS="$COVER_ARGS -type cobertura --cover cobertura.xml"

              # cover-checker is able to automatically retrieve the diff from the Github Rest API.
              # Unfortunately, it happpens that the Rest API responses are missing the patch field for some files
              # which excludes these files from being covered.
              # A merge-queue build carries no PR context, so recover the PR and the base the
              # entry was built on from the queue ref. Diffing against that commit excludes
              # what other entries merged while this one waited.
              if [[ "$BUILD_SOURCEBRANCH" =~ ^refs/heads/gh-readonly-queue/(.*)/pr-([0-9]+)-([0-9a-f]{40})$ ]]; then
                BASE_BRANCH="${BASH_REMATCH[1]}"
                PR_NUMBER="${BASH_REMATCH[2]}"
                DIFF_BASE="${BASH_REMATCH[3]}"
                # GitHub deletes the ref that made this commit reachable once that entry merges.
                if ! git fetch --depth=1 origin "$DIFF_BASE"; then
                  git fetch origin "$BASE_BRANCH"
                  DIFF_BASE="origin/$BASE_BRANCH"
                fi
              elif [[ "$PR_NUMBER_MACRO" =~ ^[0-9]+$ ]]; then
                PR_NUMBER="$PR_NUMBER_MACRO"
                git fetch origin "$TARGET_BRANCH"
                DIFF_BASE="origin/$TARGET_BRANCH"
              else
                echo "Neither a PR nor a merge-queue build ($BUILD_SOURCEBRANCH); skipping the diff coverage report"
                exit 0
              fi
              git diff "$DIFF_BASE"..HEAD > pr.diff

              $JAVA_HOME_25_X64/bin/java -jar \
                $(Build.SourcesDirectory)/ci/cover-checker-1.5.0-all.jar \
                -dt file -d pr.diff \
                $COVER_ARGS --repo "questdb/questdb" --pr "$PR_NUMBER" \
                -t $(DIFF_COVER_THRESHOLD_PCT) --github-token $(GH_TOKEN)
            displayName: "Post combined report to GitHub"
            condition: eq(variables['SHOULD_RUN'], 'true')
            env:
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              PR_NUMBER_MACRO: $(System.PullRequest.PullRequestNumber)
              TARGET_BRANCH: $(System.PullRequest.targetBranchName)
