trigger: none

pr: none

schedules:
  - cron: "0 2 * * *"
    displayName: Nightly worker-pool-mode sweep
    branches:
      include:
        - master
    always: true

# Test worker pools default their mode from a stable hash of the test identity
# (TestUtils.workerPoolModeForTestIdentity), so on a regular CI run each test
# method only ever executes one of LEGACY / FIBER_HOST. This pipeline runs the
# mode-sensitive suites with the mode pinned both ways, so every test executes
# under both shipping schedulers. The pin travels to the forked test JVM as the
# questdb.test.worker.pool.mode system property.
variables:
  QDB_LOG_W_FILE_LOCATION: "$(Build.BinariesDirectory)/tests.log"
  ARCHIVED_LOGS: "$(Build.ArtifactStagingDirectory)/questdb-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).zip"
  excludeTests: ""
  MAVEN_CACHE_FOLDER: $(HOME)/.m2/repository
  MAVEN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx3072m -XX:+UseParallelGC"
  # Wagon retry rationale: see test-pipeline.yml.
  MAVEN_RUN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Dmaven.resolver.transport=wagon -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.nonRetryableClasses=java.io.NotSerializableException -Dquestdb.test.worker.pool.mode=$(workerPoolMode)"
  MAVEN_VERSION: "version"
  MAVEN_VERSION_OPTION: "Default"
  TEST_REACTOR_ARGS: ""
  WEB_CONSOLE_PROFILE: ""

stages:
  - stage: HostedRunTestsBranches
    displayName: "Hosted Running tests"

    jobs:
      - job: RunOn
        workspace:
          clean: all
        displayName: "on"
        strategy:
          matrix:
            legacy-cutlass:
              os: Linux
              jdk: "1.25"
              testset: "all"
              workerPoolMode: "LEGACY"
              includeTests: "**/cutlass/**"
              javadoc_step: ""
              javadoc_profile: ""
            fiber-cutlass:
              os: Linux
              jdk: "1.25"
              testset: "all"
              workerPoolMode: "FIBER_HOST"
              includeTests: "**/cutlass/**"
              javadoc_step: ""
              javadoc_profile: ""
            legacy-griffin:
              os: Linux
              jdk: "1.25"
              testset: "all"
              workerPoolMode: "LEGACY"
              includeTests: "**/griffin/**"
              javadoc_step: ""
              javadoc_profile: ""
            fiber-griffin:
              os: Linux
              jdk: "1.25"
              testset: "all"
              workerPoolMode: "FIBER_HOST"
              includeTests: "**/griffin/**"
              javadoc_step: ""
              javadoc_profile: ""
            legacy-cairo-mp:
              os: Linux
              jdk: "1.25"
              testset: "all"
              workerPoolMode: "LEGACY"
              includeTests: "**/cairo/**,**/mp/**"
              javadoc_step: ""
              javadoc_profile: ""
            fiber-cairo-mp:
              os: Linux
              jdk: "1.25"
              testset: "all"
              workerPoolMode: "FIBER_HOST"
              includeTests: "**/cairo/**,**/mp/**"
              javadoc_step: ""
              javadoc_profile: ""
        pool:
          name: hetzner-incus
        timeoutInMinutes: 60
        variables:
          SOURCE_CODE_CHANGED: true
          ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).log"
        steps:
          - template: templates/checkout-source.yml
          - template: templates/use-hetzner-apt-mirrors.yml
          - bash: |
              sudo apt-get update && sudo apt-get install -y openjdk-25-jdk maven build-essential zip
              JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
              echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
              echo "JAVA_HOME will be set to: $JAVA_PATH"
          - template: templates/steps.yml
            parameters:
              isCheckoutEnabled: false
              isHetznerAptMirrorEnabled: false
