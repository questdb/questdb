trigger: none

pr: none

schedules:
  - cron: "*/15 * * * *"
    displayName: Run every 15 minutes
    branches:
      include:
        - master
    always: true

variables:
  - group: github-public-read
  - name: QDB_LOG_W_FILE_LOCATION
    value: "$(Build.BinariesDirectory)/tests.log"
  - name: ARCHIVED_LOGS
    value: "$(Build.ArtifactStagingDirectory)/questdb-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).zip"
  - name: excludeTests
    value: ""
  - name: includeTests
    value: "%regex[.*[^o].class]"
  - name: MAVEN_CACHE_FOLDER
    value: $(HOME)/.m2/repository
  - name: MAVEN_OPTS
    value: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx3072m -XX:+UseParallelGC"
  # Wagon retries a dropped connect to the single-IP cache (count + nonRetryableClasses,
  # which re-enables retry on ConnectException) instead of failing the build; the connect
  # timeout in maven-settings-hetzner.xml bounds each attempt. See test-pipeline.yml for the
  # full rationale.
  - name: MAVEN_RUN_OPTS
    value: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Dmaven.resolver.transport=wagon -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.nonRetryableClasses=java.io.NotSerializableException"
  - name: MAVEN_VERSION
    value: "version"
  - name: MAVEN_VERSION_OPTION
    value: "Default"
  # Full reactor (the fuzz regex spans core and compat), but no fuzz test serves the
  # web console, so skip its download.
  - name: TEST_REACTOR_ARGS
    value: ""
  - name: WEB_CONSOLE_PROFILE
    value: ""

stages:
  - stage: HostedRunTestsBranches
    displayName: "Hosted Running tests"

    jobs:
      - job: RunOn
        workspace:
          clean: all
        displayName: "on"
        strategy:
          matrix:
            hetzner:
              os: Linux
              jdk: "1.25"
              testset: "all"
              includeTests: "%regex[.*Fuzz.*class]"
              javadoc_step: ""
              javadoc_profile: ""
        pool:
          name: hetzner-incus
        timeoutInMinutes: 60
        variables:
          SOURCE_CODE_CHANGED: true
          ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).log"
        steps:
          - template: templates/checkout-source.yml
          - template: templates/use-hetzner-apt-mirrors.yml
          - bash: |
              sudo apt-get update && sudo apt-get install -y openjdk-25-jdk maven build-essential zip
              JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
              echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
              echo "JAVA_HOME will be set to: $JAVA_PATH"
          - template: templates/steps.yml
            parameters:
              isCheckoutEnabled: false
              isHetznerAptMirrorEnabled: false
