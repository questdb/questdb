# Temporary soak-fuzz pipeline for the nw_adaptive_commit branch (PR #7411).
#
# This file backs its own ADO definition, separate from Fuzz Tests
# (definition 25, ci/test-fuzz.yml), so the soak runs register under a
# different pipeline name and stay out of the builds channel subscription.
# One-time setup in ADO: create a new pipeline from this file (suggested
# name: Adaptive Commit Fuzz) with default branch nw_adaptive_commit, and
# do not subscribe it to the builds channel.
#
# Failures alert through the Slack webhook in the
# TMP_ADAPTIVE_COMMIT_ALERT_WEBHOOK secret variable instead. Set it in the
# pipeline settings UI; it is deliberately not defined in YAML because
# YAML-defined variables cannot be overridden from the UI. Until it is set,
# the NotifyOnFailure job skips cleanly.
#
# The soak fuzzes CONTINUOUSLY: each scheduled run loops fuzz iterations back-to-back until its time budget
# is spent, then exits so the next run re-checks-out and picks up any fix. Iterations alternate the adaptive
# crash sweeps with the ordinary fuzz suite, and every iteration draws a FRESH seed, so coverage accumulates
# across iterations rather than replaying one workload. The loop aborts on the first failure so the run goes
# red immediately rather than burning the rest of its budget.
#
# Cadence is hourly and the WHOLE RUN is budgeted to TOTAL_RUN_MINUTES (~50m), measured from a stamp taken
# before the template's own test pass. Budgeting only the loop step spent that pass for free: build
# 20260805.21 was CANCELLED at the 45m ceiling and made the next run queue 16 minutes late, on a pool that
# runs one agent at a time.
#
# Measured ON THE CI AGENT 2026-08-05 (not the dev box -- the first estimates came from there and were ~3x
# optimistic): RandomizedAdaptiveCrashFuzzTest ~10 min, the whole cairo/crash package ~26 min, the ordinary
# fuzz suite ~12 min. Hence a ~10m first pass plus roughly two loop iterations inside the hour.
#
# A full-suite pass still runs once nightly, sharded into separate JVMs so a long/OOM-prone sweep cannot
# poison the rest of the suite. Delete this file after the squash-merge; the branch deletion leaves the
# definition with nothing to schedule.
#
# The soak cron deliberately skips 00:00-01:59 so the 01:00 nightly gets the pool to itself: the pool runs
# one agent at a time, so a soak queued mid-nightly does not just delay itself, it wedges between two nightly
# shards and stretches the nightly's test work over several hours.
#
# CADENCE IS EVERY TWO HOURS, and that is a capacity decision, not a preference. A soak run takes a very
# steady ~49m (median over 300 finished builds, range 46-54). Hourly put a 49m job into a 60m slot on a
# single agent -- 82% utilisation before counting the nightly -- and at that utilisation any variance
# queues and never drains. It showed up every morning as a backlog behind the 01:00 nightly (02:00 waited
# 46m, 03:00 35m, 04:00 26m, draining only by 06:00) and, when anything perturbed it, compounded into
# multi-day waits: builds queued 2026-08-12 waited 8104m, i.e. the fuzzer was soaking week-old commits
# while reporting against the branch head. Two-hourly is ~41% utilisation: the nightly is absorbed, the
# queue drains, and each run still draws a fresh seed. Fewer long sweeps beat more truncated ones -- the
# value is in uninterrupted seed runs, not in runs per day.
#
# If you raise the cadence again, cut TOTAL_RUN_MINUTES to match: keep run-minutes per slot under ~60%.
#
# ======================================================================================
# The durability battery (RunDurabilitySweep) shares this definition because it needs the
# same single agent, and a second definition cannot see this one's schedule.
#
# RunContinuousSoak selects itself negatively -- "any schedule that is not the nightly" --
# so every cron added to this file must also be named in its exclusion list, or that cron
# starts a 65-minute soak on a one-agent pool.
#
# The battery runs a QEMU-guest crash harness (tools/durability/vm) in the gap between the
# 22:00 soak and the 01:00 nightly, protected by a wall-clock deadline rather than a
# timeout: a scheduled build's start time drifts with the queue while 01:00 does not.
# ======================================================================================

trigger: none

pr: none

# Queue-time knobs for RunDurabilitySweep only; they do not touch the soak or the nightly.
# Scheduled runs take the defaults.
parameters:
  # nightly   -- the scheduled battery: controls, then sweeps, deadline-trimmed.
  # provision -- build the golden guest image and accept it with t01, no sweeps. Run once
  #              per agent, by hand and outside the window; it takes 10-15 min.
  # smoke     -- the battery at minimum point counts, to measure this agent. Run this
  #              first: no timing in this file was measured on the CI agent.
  - name: durabilityMode
    type: string
    default: nightly
    values:
      - nightly
      - provision
      - smoke
  # Points per reference sweep. Raised from 40 once the battery stopped spending its window
  # on dimensions the modelled Java suite already covers: measured at ~4.8 s per reference
  # boundary, 80 points costs ~7 minutes and the window has room. Raise further only from a
  # measured per-point rate in a previous run's TIMING block.
  - name: refPoints
    type: number
    default: 60
  # The product arm pays 11-14 s per point (recovery pass + replay server) against ~2-7 s
  # for the reference arm, so it runs at far fewer points. Build 270631 measured 22.8 s per
  # point on the CI agent, under a concurrent soak.
  - name: productPoints
    type: number
    default: 20
  # Points per MATRIX cell. The matrix is breadth, not depth: one cell per dimension of the
  # harness's coverage table, at few points each, after the three core sweeps have run at
  # full depth. 0 disables the matrix and restores the pre-matrix battery exactly.
  - name: matrixPoints
    type: number
    default: 8
  # Treat the cells listed in KNOWN_DEFECTS (see the sweeps step) as expected failures:
  # they run, they publish their verdicts, and their failure does not fail the job. Set
  # this false to make them count, which is what a run verifying a fix wants.
  - name: tolerateKnownDefects
    type: boolean
    default: true
  # Manual escape hatch: a run queued by hand at 10:00 would otherwise refuse, its
  # pre-nightly deadline being in the past. Never set on the schedule.
  - name: ignoreWindow
    type: boolean
    default: false
  # The deliberate way in by hand. RunDurabilitySweep selects itself on the cron's
  # displayName, which is undefined for a manual queue, so a stray click cannot boot a VM --
  # and a manual queue could not otherwise run the battery at all. Tick this in the Run
  # dialog. It also suppresses the soak for that run, which would run first on the
  # one-agent pool and eat the window.
  - name: forceDurability
    type: boolean
    default: false

schedules:
  - cron: "0 2-22/2 * * *"
    displayName: Run continuous soak (outside nightly window)
    branches:
      include:
        - nw_adaptive_commit
    always: true
  - cron: "0 1 * * *"
    displayName: Run adaptive crash nightly
    branches:
      include:
        - nw_adaptive_commit
    always: true
  # The durability battery. Live since build 270631, which ran the whole battery green on
  # this agent: controls t06/t07/t10 passed, then all three arms returned verdicts
  # (reference W=0 11/11 DURABLE, reference W=50000 11/11 RPO_OK, product W=50000 4/4
  # RPO_OK). Before that, three manual runs settled the infrastructure in turn -- KVM in an
  # unprivileged container, the persistent golden image, and the client's native library.
  #
  # 23:00 UTC is the one clean gap in the day: the soaks run even hours 02:00-22:00 and the
  # nightly runs at 01:00, so nothing else is scheduled against this window. The cron may
  # still queue behind a long 22:00 soak; ADO starts the job when the agent frees, and an
  # early start simply buys sweep points. What protects the 01:00 nightly is
  # DURABILITY_DEADLINE_UTC in the job below, not this cron. If the nightly cron moves,
  # move that deadline with it.
  #
  # RunContinuousSoak's condition excludes this cron by name. Keep that exclusion: without
  # it the 23:00 slot starts a 65-minute soak as well, on a one-agent pool.
  #
  # Point counts still come from the parameter defaults, which were measured on a developer
  # box. Build 270631 measured this agent at ~4.8 s per reference boundary and ~22.8 s per
  # product boundary, but under a concurrent soak, so those are upper bounds and are not yet
  # the basis for the defaults.
  - cron: "0 23 * * *"
    displayName: Run durability sweep
    branches:
      include:
        - nw_adaptive_commit
    always: true

variables:
  QDB_LOG_W_FILE_LOCATION: "$(Build.BinariesDirectory)/tests.log"
  ARCHIVED_LOGS: "$(Build.ArtifactStagingDirectory)/questdb-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).zip"
  excludeTests: ""
  includeTests: "%regex[.*[^o].class]"
  MAVEN_CACHE_FOLDER: $(HOME)/.m2/repository
  MAVEN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx3072m -XX:+UseParallelGC"
  # Wagon retries a dropped connect to the single-IP cache (count + nonRetryableClasses,
  # which re-enables retry on ConnectException) instead of failing the build; the connect
  # timeout in maven-settings-hetzner.xml bounds each attempt. See test-pipeline.yml for the
  # full rationale.
  MAVEN_RUN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Dmaven.resolver.transport=wagon -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.nonRetryableClasses=java.io.NotSerializableException"
  MAVEN_VERSION: "version"
  MAVEN_VERSION_OPTION: "Default"
  # Full reactor (the fuzz regex spans core and compat), but no fuzz test serves the
  # web console, so skip its download.
  TEST_REACTOR_ARGS: ""
  WEB_CONSOLE_PROFILE: ""

stages:
  - stage: HostedRunTestsBranches
    displayName: "Hosted Running tests"

    jobs:
      - job: RunContinuousSoak
        # An explicit exclusion list, not a single ne(). This job selects itself negatively
        # -- "whatever schedule is not the nightly" -- which silently means "and every
        # schedule added to this file in future". Name every schedule it must NOT run on,
        # and add to this list whenever a schedule is added above.
        # The last clause covers a manual queue with forceDurability=true: that is a
        # dedicated durability run, and a soak running first would eat its window.
        condition: and(ne(variables['Build.CronSchedule.DisplayName'], 'Run adaptive crash nightly'), ne(variables['Build.CronSchedule.DisplayName'], 'Run durability sweep'), ne('${{ parameters.forceDurability }}', 'true'))
        workspace:
          clean: all
        displayName: "continuous soak"
        strategy:
          matrix:
            hetzner:
              os: Linux
              jdk: "1.25"
              testset: "all"
              # Iteration 1 runs through the shared template (which also builds). Scope it to the fuzz
              # class (~10m on the CI agent) rather than the whole crash package (~26m measured on build
              # 20260805.21) -- the loop below covers the rest, and an oversized first pass ate the entire
              # job before the loop could run.
              includeTests: "**/cairo/crash/RandomizedAdaptiveCrashFuzzTest.java"
              javadoc_step: ""
              javadoc_profile: ""
        pool:
          # The soak fuzzes on its own pool so it never takes agents away from PR builds.
          name: hetzner-adaptive-commit-fuzz
        # Headroom, NOT the target. The run is budgeted to TOTAL_RUN_MINUTES below (~50m inside an hourly
        # cadence); this only stops a pathological iteration hanging the agent. Build 20260805.21 hit the
        # old 45m ceiling and was CANCELLED because the budget ignored time already spent by the template's
        # own pass -- on this single-agent pool that also made the next run queue 16 minutes late.
        timeoutInMinutes: 90
        variables:
          SOURCE_CODE_CHANGED: true
          # Enables the nightly-gated crash sweeps. Without it every class under cairo/crash that extends
          # AbstractAdaptiveCrashSweepTest is assumption-skipped and the soak silently fuzzes nothing.
          MAVEN_RUN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Dquestdb.fuzz.nightly=true -Dmaven.resolver.transport=wagon -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.nonRetryableClasses=java.io.NotSerializableException"
          # Budget for the WHOLE RUN, measured from job start -- not for the loop step alone. The previous
          # version budgeted only the loop, so the template's own pass was spent "for free" and the job blew
          # its ceiling. 50m fits ~2m setup + the template's own pass + ONE iteration -- the
          # pass measures ~20m on the agent, not the ~10m originally assumed, which is why a second
          # iteration never starts and the phase is chosen per RUN rather than per iteration. MIN_ITERATION_MINUTES is the conservative length of the LONGEST iteration measured
          # on the CI agent (crash package ~26m; ordinary fuzz ~12m) so the loop never starts one it cannot
          # finish inside the budget.
          # 65, not 50. At 50 the crash-sweep iteration NEVER COMPLETED: the template's own test pass
          # eats 16-23m, leaving ~29m against a crash package that now needs more than that (this branch
          # added ChecksumArtifacts/MetaChecksum/TxnLogCrcSidecar/PartitionChecksum crash classes), so
          # every phase-1 soak ended "hit the run budget and was stopped cleanly" -- green, and never a
          # finished sweep. Worse, build 263283 used 23m on the pass and then started NO iteration at
          # all (27m needed, ~27m left), fuzzing nothing while reporting success.
          # 65 leaves 42m+ for the iteration. Utilisation stays ~54% of the 2h slot.
          TOTAL_RUN_MINUTES: 65
          MIN_ITERATION_MINUTES: 27
          ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk).log"
        steps:
          - template: templates/checkout-source.yml
          - template: templates/use-hetzner-apt-mirrors.yml
          - bash: |
              sudo apt-get update && sudo apt-get install -y openjdk-25-jdk maven build-essential zip
              JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
              echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
              echo "JAVA_HOME will be set to: $JAVA_PATH"
              # Stamp job start so the soak loop can budget the WHOLE RUN. The loop step's own SECONDS
              # starts at zero AFTER the template's test pass, so budgeting from there spends that pass
              # for free -- which is what pushed build 20260805.21 past its ceiling and got it cancelled.
              date +%s > "$(Agent.TempDirectory)/soak_start_epoch"
          - template: templates/steps.yml
            parameters:
              isCheckoutEnabled: false
              isHetznerAptMirrorEnabled: false
          - bash: |
              set -uo pipefail
              # Iteration 1 was the template's own test pass. Keep going until the budget is spent, so the
              # agent fuzzes continuously instead of idling until the next cron. Each mvn invocation draws a
              # fresh seed (RandomizedAdaptiveCrashFuzzTest#drawSeed under -Dquestdb.fuzz.nightly), so every
              # iteration is a new workload. No `clean`: the build from the template is reused.
              # Budget the WHOLE RUN from the stamp taken before the template pass, not this step's own
              # SECONDS -- the template pass is ~10m and was previously unbudgeted.
              start=$(cat "$(Agent.TempDirectory)/soak_start_epoch" 2>/dev/null || echo 0)
              now=$(date +%s)
              if [ "$start" -eq 0 ]; then
                echo "##vso[task.logissue type=warning]soak start stamp missing; budgeting from this step only"
                start=$now
              fi
              budget=$(( TOTAL_RUN_MINUTES * 60 ))
              elapsed=$(( now - start ))
              echo "run already used $(( elapsed / 60 ))m of its ${TOTAL_RUN_MINUTES}m budget before the loop"
              # Only START an iteration if a whole one can still finish. Checking just "budget left > 0"
              # lets an iteration begin with a second to spare and run to the job timeout -- which reports
              # as a hard-killed red that looks like a test failure.
              min_iter=$(( MIN_ITERATION_MINUTES * 60 ))
              # Which family this RUN fuzzes. Alternating per ITERATION does not work: a run only ever
              # fits ONE iteration (the template's own pass takes ~20m of the 50m budget, leaving ~28m
              # against a 27m minimum), and that iteration is always number 2 -- even -- so the loop
              # picked ordinary-fuzz every single time and the adaptive crash sweeps were NEVER soaked.
              # They ran only in the 01:00 nightly, which is precisely the coverage this branch needs
              # most. Measured on build 262546: "soak iteration 2 (ordinary-fuzz), 28m budget left".
              #
              # Alternate on the scheduled hour instead: the cron fires at 02,04,...,22, so (hour/2)%2
              # flips every run. A badly delayed start can repeat a phase; that is acceptable because
              # both phases now run many times a day, and it degrades to "some extra ordinary-fuzz",
              # never to "no crash sweeps".
              # 10# forces base 10. date +%H emits a LEADING ZERO, and bash reads 08/09 as octal, where
              # 8 and 9 are not valid digits: "value too great for base (error token is 08)". With set -u
              # that left phase unbound and failed the whole run (build 262642, the 08:00 soak).
              phase=$(( ( 10#$(date -u +%H) / 2 ) % 2 ))
              echo "run phase=$phase ($([ $phase -eq 0 ] && echo ordinary-fuzz || echo adaptive-crash-sweeps) first)"
              iter=1
              rc=0
              while [ $(( budget - ( $(date +%s) - start ) )) -ge "$min_iter" ]; do
                iter=$((iter + 1))
                if [ $(( (iter + phase) % 2 )) -eq 0 ]; then
                  inc='%regex[.*Fuzz.*class]'; what='ordinary-fuzz'
                else
                  inc='**/cairo/crash/*.java'; what='adaptive-crash-sweeps'
                fi
                echo "=== soak iteration $iter ($what), $(( (budget - ( $(date +%s) - start )) / 60 ))m budget left ==="
                # Bound the ITERATION, not just the decision to start one. min_iter is an estimate; an
                # iteration that runs long would otherwise be killed by the step timeout, which reports
                # as a hard red indistinguishable from a real fuzz failure. A clean cut here is reported
                # as budget exhaustion instead.
                remaining=$(( budget - ( $(date +%s) - start ) ))
                timeout --signal=TERM --kill-after=60s "${remaining}s" \
                  mvn -f pom.xml -s "${MAVEN_SETTINGS_FILE:-ci/maven-settings-hetzner.xml}" \
                  --batch-mode --quiet \
                  -Dtest.include="$inc" -Dtest.exclude= \
                  -Dout="$(Build.SourcesDirectory)/ci/qlog.conf" \
                  -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
                  -P local-client $(MAVEN_RUN_OPTS) test
                rc=$?
                if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
                  echo "soak iteration $iter ($what) hit the run budget and was stopped cleanly; not a failure"
                  rc=0
                  break
                fi
                if [ $rc -ne 0 ]; then
                  echo "##vso[task.logissue type=error]soak iteration $iter ($what) FAILED - stopping. Replay the seed printed above with -Dquestdb.fuzz.seed=<s0>,<s1>"
                  break
                fi
              done
              # Say what was NOT run: a soak that stops early because the budget could not fit another
              # iteration must not read as "the whole budget was fuzzed".
              if [ $rc -eq 0 ]; then
                echo "soak ran $iter iteration(s); stopped with $(( (budget - ( $(date +%s) - start )) / 60 ))m left" \
                     "(less than the ${MIN_ITERATION_MINUTES}m an iteration needs)"
              fi
              exit $rc
            displayName: "Continuous soak loop"
            # MUST exceed TOTAL_RUN_MINUTES, or the loop is hard-killed mid-iteration and Slack reports
            # "Adaptive Commit Fuzz Failed" for a run in which nothing failed. It was 30 while the loop
            # budgeted against 50, so any iteration started with the permitted 27m of budget left ran
            # past the cap: builds 260301/260319/260329/260424 all died as "The task has timed out"
            # after sweeping thousands of seeds with zero test failures.
            timeoutInMinutes: 60

      - job: RunAdaptiveCrashNightly
        displayName: "adaptive crash nightly"
        condition: eq(variables['Build.CronSchedule.DisplayName'], 'Run adaptive crash nightly')
        workspace:
          clean: all
        strategy:
          matrix:
            randomized:
              os: Linux
              jdk: "1.25"
              testset: "all"
              includeTests: "**/cairo/crash/RandomizedAdaptiveCrashFuzzTest.java"
              excludeTests: ""
              javadoc_step: ""
              javadoc_profile: ""
            crash_sweeps:
              os: Linux
              jdk: "1.25"
              testset: "all"
              includeTests: "**/cairo/crash/AdaptiveIndexedSymbolLazyGapCrashSweepTest.java,**/cairo/crash/AdaptiveMatViewLazyGapCrashSweepTest.java,**/cairo/crash/AdaptiveMultiPartitionLazyGapCrashSweepTest.java,**/cairo/crash/AdaptiveMultiTableLazyGapCrashSweepTest.java,**/cairo/crash/AdaptiveO3CrashSweepTest.java,**/cairo/crash/AdaptiveO3LazyGapCrashSweepTest.java,**/cairo/crash/AdaptiveRebootOrphanReclaimCrashTest.java"
              excludeTests: ""
              javadoc_step: ""
              javadoc_profile: ""
            soak_self_check:
              os: Linux
              jdk: "1.25"
              testset: "all"
              includeTests: "**/cairo/crash/AdaptiveCrashSweepSelfCheckTest.java,**/cairo/crash/AdaptiveSoakCrashTest.java"
              excludeTests: ""
              javadoc_step: ""
              javadoc_profile: ""
            durability_fuzz:
              os: Linux
              jdk: "1.25"
              testset: "all"
              includeTests: "**/cairo/crash/AdaptiveMultiWriterDurableAckCrashFuzzTest.java,**/cairo/crash/AdaptiveQwpDurableAckNoLossCrashTest.java,**/cairo/crash/VarcharPowerLossFuzzTest.java"
              excludeTests: ""
              javadoc_step: ""
              javadoc_profile: ""
        pool:
          name: hetzner-adaptive-commit-fuzz
        timeoutInMinutes: 180
        variables:
          SOURCE_CODE_CHANGED: true
          MAVEN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx6144m -XX:+UseParallelGC"
          MAVEN_RUN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Dquestdb.fuzz.nightly=true -Dmaven.resolver.transport=wagon -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.nonRetryableClasses=java.io.NotSerializableException"
          ARCHIVED_LOGS: "$(Build.ArtifactStagingDirectory)/questdb-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk)-$(System.JobName).zip"
          ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk)-$(System.JobName).log"
        steps:
          - template: templates/checkout-source.yml
          - template: templates/use-hetzner-apt-mirrors.yml
          - bash: |
              sudo apt-get update && sudo apt-get install -y openjdk-25-jdk maven build-essential zip
              JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
              echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
              echo "JAVA_HOME will be set to: $JAVA_PATH"
          - template: templates/steps.yml
            parameters:
              isCheckoutEnabled: false
              isHetznerAptMirrorEnabled: false
              testTimeoutInMinutes: 165
              artifactNameSuffix: "-$(System.JobName)"

      - job: RunFullSuiteNightly
        displayName: "full suite nightly"
        condition: eq(variables['Build.CronSchedule.DisplayName'], 'Run adaptive crash nightly')
        workspace:
          clean: all
        strategy:
          matrix:
            full:
              os: Linux
              jdk: "1.25"
              testset: "all"
              # PR CI splits this across five parallel stages; here it is one JVM on one agent,
              # so budget hours, not minutes. The crash package is excluded because the sharded
              # jobs above already own it -- and they own it with the nightly flag set, which
              # this job deliberately does not set.
              includeTests: "%regex[.*[^o].class]"
              excludeTests: "**/cairo/crash/**"
              javadoc_step: ""
              javadoc_profile: ""
        pool:
          name: hetzner-adaptive-commit-fuzz
        timeoutInMinutes: 330
        variables:
          SOURCE_CODE_CHANGED: true
          MAVEN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx6144m -XX:+UseParallelGC"
          # A full pass reaches the http/web-console tests that the fuzz-only default skips, so
          # unlike the other jobs here it has to build the console assets.
          WEB_CONSOLE_PROFILE: "-P build-web-console"
          ARCHIVED_LOGS: "$(Build.ArtifactStagingDirectory)/questdb-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk)-$(System.JobName).zip"
          ARCHIVED_CRASH_LOG: "$(Build.ArtifactStagingDirectory)/questdb-crash-$(Build.SourceBranchName)-$(Build.SourceVersion)-$(System.StageAttempt)-$(Agent.OS)-$(jdk)-$(System.JobName).log"
        steps:
          - template: templates/checkout-source.yml
          - template: templates/use-hetzner-apt-mirrors.yml
          - bash: |
              sudo apt-get update && sudo apt-get install -y openjdk-25-jdk maven build-essential zip
              JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
              echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
              echo "JAVA_HOME will be set to: $JAVA_PATH"
          - template: templates/steps.yml
            parameters:
              isCheckoutEnabled: false
              isHetznerAptMirrorEnabled: false
              testTimeoutInMinutes: 315
              artifactNameSuffix: "-$(System.JobName)"

      # ===================================================================================
      # THE DURABILITY BATTERY. QEMU-guest crash harness, tools/durability/vm: one workload
      # run recorded by dm-log-writes, then replayed to every flush boundary and verified
      # (run-flush-sweep.sh).
      #
      # The interlock with the 01:00 nightly is a wall-clock deadline, not timeoutInMinutes.
      # ADO measures a step timeout from job start, and a scheduled build's start drifts with
      # the queue while 01:00 does not; ADO will not cancel the nightly either, it will queue
      # it behind us. So every phase below checks DURABILITY_DEADLINE_UTC, refuses to start a
      # phase it cannot finish, and wraps it in `timeout`. A cut phase is recorded as skipped
      # and never as a pass: a phase hard-killed by a step timeout reports as a failure
      # indistinguishable from a real durability failure.
      #
      # When this goes away, four things go together, because three are invisible from this
      # job: the RunDurabilitySweep job below, the "Run durability sweep" cron, the
      # `parameters` block at the top of this file, and the exclusion for that cron in
      # RunContinuousSoak's condition -- leaving the last one behind starts a soak in the
      # 23:00 slot. Then reap $HOME/qdb-vmcrash-state on the agent: the golden image is ~3 GB
      # and nothing else will remove it.
      # ===================================================================================
      - job: RunDurabilitySweep
        displayName: "durability battery (${{ parameters.durabilityMode }})"
        # Positive selection, unlike the soak: Build.CronSchedule.DisplayName is undefined
        # for a manual queue, so clicking Run cannot boot a VM by accident and forceDurability
        # is the deliberate way in. A boolean parameter interpolates as "True"/"False", which
        # is safe in a condition() but not in bash -- the window gate below tests both.
        condition: or(eq(variables['Build.CronSchedule.DisplayName'], 'Run durability sweep'), eq('${{ parameters.forceDurability }}', 'true'))
        workspace:
          clean: all
        pool:
          name: hetzner-adaptive-commit-fuzz
        # Headroom only; the real control is DURABILITY_DEADLINE_UTC.
        timeoutInMinutes: 90
        cancelTimeoutInMinutes: 10
        variables:
          SOURCE_CODE_CHANGED: true
          # Hard wall-clock stop, UTC, 15 minutes before the 01:00 nightly.
          DURABILITY_DEADLINE_UTC: "00:45"
          # Held back for publish + kill + reap, which must not be left without wall clock.
          DURABILITY_RESERVE_MINUTES: 8
          # Outside the workspace, which `clean: all` wipes, so the golden image survives.
          # Keep "qdb-vmcrash" in the name: the orphan sweeper matches 'qemu.*qdb-vmcrash'.
          #
          # Absolute and literal, never $(HOME)/...: ADO expands $(...) in a script body but
          # exports job variables to the task environment RAW, and every harness script reads
          # this one from the environment. As "$(HOME)/qdb-vmcrash-state" the two halves of
          # the job disagreed inside a single step -- the inline `reap-state.sh --state=` saw
          # /home/agent/qdb-vmcrash-state while check-host.sh saw the literal '$(HOME)/...' --
          # so build-image.sh wrote the ~3 GB golden image into a directory named '$(HOME)'
          # under the workspace, `clean: all` deleted it, and t01 died on a backing file that
          # had never been where the overlay recorded it (build 270594).
          #
          # This is the persistent mount added by roles/incus/tasks/durability-devices.yml in
          # azure-ci-runners. The budget step below refuses the run if it stops matching the
          # agent's real $HOME, and check-host.sh independently refuses any state dir that is
          # relative or still carries a macro.
          QDB_VMCRASH_STATE: /home/agent/qdb-vmcrash-state
          DURABILITY_RESULTS: $(Build.ArtifactStagingDirectory)/durability-results
          MAVEN_OPTS: "-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx4096m -XX:+UseParallelGC"
          # Every step in templates/build-client-native.yml is conditioned on this. The other
          # jobs get it from their matrix leg; this job has no matrix, so without it the
          # template is included and does nothing -- a green build producing a client jar the
          # product arm cannot load.
          os: Linux
        steps:
          - template: templates/checkout-source.yml
          - template: templates/use-hetzner-apt-mirrors.yml

          # 0. BUDGET + LOCK + WINDOW GATE. Everything that can refuse the run cheaply
          #    happens before a single package is installed.
          - bash: |
              set -uo pipefail
              BUDGET_SH="$(Agent.TempDirectory)/durability-budget.sh"
              now=$(date -u +%s)

              dl_today=$(date -u -d "today $(DURABILITY_DEADLINE_UTC)" +%s)
              if [ "$dl_today" -le "$now" ]; then
                deadline=$(date -u -d "tomorrow $(DURABILITY_DEADLINE_UTC)" +%s)
              else
                deadline=$dl_today
              fi

              job_cap=$(( now + (90 - $(DURABILITY_RESERVE_MINUTES)) * 60 ))
              dl_cap=$(( deadline - $(DURABILITY_RESERVE_MINUTES) * 60 ))
              end=$(( dl_cap < job_cap ? dl_cap : job_cap ))

              echo "now      $(date -u -d "@$now")"
              echo "deadline $(date -u -d "@$deadline")   (DURABILITY_DEADLINE_UTC=$(DURABILITY_DEADLINE_UTC))"
              echo "budget   ends $(date -u -d "@$end")  -> $(( (end - now) / 60 )) usable minutes"

              # A phase begun with no budget runs into the job timeout and reports as a red
              # indistinguishable from a durability failure.
              usable=$(( (end - now) / 60 ))
              if [ "$usable" -lt 20 ] && [ "${{ parameters.ignoreWindow }}" != "True" ] && [ "${{ parameters.ignoreWindow }}" != "true" ]; then
                echo "##vso[task.logissue type=warning]only ${usable}m of budget before $(DURABILITY_DEADLINE_UTC) UTC; refusing to start so the 01:00 nightly is not delayed"
                echo "##vso[task.setvariable variable=DURABILITY_SKIP]true"
                # Skipped, never a pass: a green tick for a run that measured nothing reads
                # as evidence.
                mkdir -p "$(DURABILITY_RESULTS)"
                cat > "$(DURABILITY_RESULTS)/window.xml" <<XML
              <?xml version="1.0" encoding="UTF-8"?>
              <testsuites><testsuite name="durability.window" tests="1" failures="0" skipped="1" errors="0" time="0">
                <testcase classname="durability.window" name="pre-nightly-gap">
                  <skipped message="only ${usable}m before the 01:00 nightly; no measurement taken"/>
                </testcase>
              </testsuite></testsuites>
              XML
                exit 0
              fi

              # The state dir is a literal path (see QDB_VMCRASH_STATE above), so it is this
              # job's business to prove it is still the right literal on the agent it landed
              # on. Silent drift costs a ~3 GB image rebuild every run at best, and at worst
              # writes it inside the workspace that `clean: all` wipes.
              STATE="$(QDB_VMCRASH_STATE)"
              if [ "$STATE" != "$HOME/qdb-vmcrash-state" ]; then
                echo "##vso[task.logissue type=error]QDB_VMCRASH_STATE is '$STATE' but this agent's home is '$HOME'. The persistent mount is \$HOME/qdb-vmcrash-state (roles/incus/tasks/durability-devices.yml in azure-ci-runners); update the variable in ci/test-fuzz-adaptive.yml to match."
                exit 1
              fi

              # ADO has no concurrency group for ordinary jobs, so a second agent would mean
              # two qemus against one $QDB_VMCRASH_STATE.
              LOCK="$STATE/.durability-ci.lock"
              mkdir -p "$STATE"

              # Warning, not a gate: a state dir that is not a mount still works, it just does
              # not survive the container. This is what a host rebuild without the Ansible
              # change looks like -- green runs that rebuild the image every night.
              if command -v mountpoint >/dev/null 2>&1 && ! mountpoint -q "$STATE"; then
                echo "##vso[task.logissue type=warning]$STATE is not a mount point, so the golden image will not outlive this ephemeral container. Apply roles/incus/tasks/durability-devices.yml (tag durability_devices) to this host."
              fi
              if ! mkdir "$LOCK" 2>/dev/null; then
                echo "lock held by: $(cat "$LOCK/owner" 2>/dev/null || echo unknown)"
                age=$(( now - $(stat -c %Y "$LOCK" 2>/dev/null || echo "$now") ))
                if [ "$age" -gt 10800 ]; then
                  echo "##vso[task.logissue type=warning]stealing a $(( age / 60 ))m-old durability lock"
                  rm -rf "$LOCK"; mkdir "$LOCK" || { echo "cannot take the lock"; exit 1; }
                else
                  echo "##vso[task.logissue type=error]another durability run holds the lock ($(( age / 60 ))m old); refusing to run a second VM"
                  exit 1
                fi
              fi
              echo "build=$(Build.BuildId) agent=${AGENT_MACHINENAME:-unknown} started=$(date -u)" > "$LOCK/owner"

              # Orphaned qemu from a hard-cancelled build corrupts this run and pins its
              # disks past every reap. Safe to kill only because we hold the lock.
              if pgrep -af 'qemu.*qdb-vmcrash' ; then
                echo "##vso[task.logissue type=warning]orphaned qemu from an earlier build; killing (we hold the lock, so none of these is live work)"
                pkill -f 'qemu.*qdb-vmcrash' || true
                sleep 3
                pkill -9 -f 'qemu.*qdb-vmcrash' || true
              else
                echo "no orphaned qemu"
              fi

              cat > "$BUDGET_SH" <<EOF
              DURABILITY_END=$end
              remaining() { echo \$(( DURABILITY_END - \$(date -u +%s) )); }
              phase_fits() { [ "\$(remaining)" -ge \$(( \$1 * 60 )) ]; }
              # run_phase NAME MIN_MINUTES CMD... runs a phase inside the remaining budget,
              # never starting one it cannot finish. A skip returns 0 -- a deadline skip is
              # not a failure -- but it is not a pass either, so it is recorded in
              # durability-skipped.txt and the controls step consults it before the sweeps.
              run_phase() {
                  local name="\$1" need="\$2"; shift 2
                  local left=\$(( \$(remaining) / 60 )); [ \$left -lt 0 ] && left=0
                  if ! phase_fits "\$need"; then
                      echo "SKIPPED \$name — needs \${need}m, \${left}m left before the nightly"
                      echo "\$name" >> "$(Agent.TempDirectory)/durability-skipped.txt"
                      return 0
                  fi
                  echo "=== \$name (\$(( \$(remaining) / 60 ))m budget left) ==="
                  local t0=\$(date +%s) rc=0
                  timeout --signal=TERM --kill-after=60s "\$(remaining)s" "\$@"; rc=\$?
                  echo "\$name \$(( \$(date +%s) - t0 ))s rc=\$rc" >> "$(Agent.TempDirectory)/durability-timing.txt"
                  if [ \$rc -eq 124 ] || [ \$rc -eq 137 ]; then
                      echo "CUT \$name — hit the pre-nightly deadline and was stopped cleanly; not a failure"
                      echo "\$name (cut at the deadline)" >> "$(Agent.TempDirectory)/durability-skipped.txt"
                      return 0
                  fi
                  return \$rc
              }
              EOF
              : > "$(Agent.TempDirectory)/durability-timing.txt"
              : > "$(Agent.TempDirectory)/durability-skipped.txt"
              # Staging copies only files newer than this marker: sweep-out/ and evidence/
              # are rolling archives, and re-staging them re-uploads old runs every night.
              : > "$(Agent.TempDirectory)/durability-started.marker"
              echo "##vso[task.setvariable variable=DURABILITY_SKIP]false"
            displayName: "Budget, lock, and window gate"
            timeoutInMinutes: 5

          - bash: |
              set -uo pipefail
              sudo apt-get update
              sudo apt-get install -y openjdk-25-jdk maven build-essential zip \
                                      qemu-system-x86 qemu-utils genisoimage libcap2-bin acl

              # Take the /dev/kvm grant HERE, after the install, because the install is what
              # takes it away. qemu-system-common's postinst reloads and triggers the udev
              # rules, and `KERNEL=="kvm", GROUP="kvm"` chowns the node back to root:kvm --
              # discarding whatever the Incus profile put there at container start. That is
              # the whole history of this gate: build 270612 passed with root:kvm 0666, where
              # the 0666 came from a hot-plugged device and made the owner irrelevant; build
              # 270627 failed with root:kvm 0660 on an identically configured agent, because
              # its node was created at container start, where Incus 7.1 ignores `mode`.
              #
              # An ACL for this user is immediate (it is evaluated at open(2), so the running
              # agent process needs no new session), it is the narrowest grant that works, and
              # taking it after the disturbance means no container-image or profile change can
              # silently undo it. The gate two steps below is still the authority: if this
              # fails, the run stops there and says so.
              if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
                echo "/dev/kvm already readable+writable by $(id -un)"
              else
                echo "/dev/kvm not usable by $(id -un) after the qemu install; taking an ACL"
                ls -l /dev/kvm || true
                sudo setfacl -m "u:$(id -un):rw" /dev/kvm \
                  || { echo "setfacl failed; falling back to a mode grant"; sudo chmod 0666 /dev/kvm; }
              fi
              ls -l /dev/kvm || true
              getfacl -p /dev/kvm 2>/dev/null | sed 's/^/  /' || true

              JAVA_PATH="/usr/lib/jvm/java-25-openjdk-amd64"
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_PATH"
              echo "##vso[task.setvariable variable=JAVA_HOME_25_X64]$JAVA_PATH"
              echo "JAVA_HOME will be set to: $JAVA_PATH"
              "$JAVA_PATH/bin/java" -version
            displayName: "Install JDK 25, Maven, qemu, genisoimage"
            timeoutInMinutes: 15
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'))

          # 1. AGENT CAPABILITY FACTS — "can this agent run a VM at all?", answered inside
          #    the run. Never fails the job; the gate is the next step.
          - bash: |
              set -uo pipefail
              echo "##[group]QDB_AGENT facts (grep QDB_AGENT to read them all at once)"
              f() { printf 'QDB_AGENT %s=%s\n' "$1" "$2"; }

              # --- identity. Incus containers sharing the host kernel, so /dev/kvm is not
              #     a given.
              f agent "${AGENT_MACHINENAME:-unknown}"
              f virt_container "$(systemd-detect-virt -c 2>/dev/null || echo detect-failed)"
              f virt_vm "$(systemd-detect-virt -v 2>/dev/null || echo detect-failed)"

              # --- /dev/kvm: present, char device, rw without sudo; all three required.
              if [ -e /dev/kvm ]; then
                f kvm_present yes
                [ -c /dev/kvm ] && f kvm_chardev yes || f kvm_chardev no
                [ -r /dev/kvm ] && f kvm_readable yes || f kvm_readable no
                [ -w /dev/kvm ] && f kvm_writable yes || f kvm_writable no
                ls -l /dev/kvm || true
                getfacl -p /dev/kvm 2>/dev/null || echo "(getfacl unavailable)"
              else
                f kvm_present no; f kvm_chardev no; f kvm_readable no; f kvm_writable no
              fi
              if grep -qE '(vmx|svm)' /proc/cpuinfo; then
                f cpu_virt "$(grep -oE '\b(vmx|svm)\b' /proc/cpuinfo | head -1)"
              else
                f cpu_virt none
              fi

              # --- capabilities and modules: decisive only to a VM-free fallback.
              capeff=$(awk '/^CapEff/{print $2}' /proc/self/status)
              f cap_eff "$capeff"
              if command -v capsh >/dev/null 2>&1; then
                dec=$(capsh --decode="$capeff" 2>/dev/null || echo)
                case "$dec" in *cap_sys_admin*) f cap_sys_admin yes ;; *) f cap_sys_admin no ;; esac
              else
                f cap_sys_admin unknown
              fi
              if sudo -n true 2>/dev/null; then f sudo_nopasswd yes; else f sudo_nopasswd no; fi
              for m in kvm kvm_amd kvm_intel dm_mod dm_log_writes loop; do
                loaded=no; [ -d "/sys/module/${m}" ] && loaded=yes
                info=no;   modinfo "$m" >/dev/null 2>&1 && info=yes
                f "mod_${m}_loaded" "$loaded"
                f "mod_${m}_modinfo" "$info"
              done

              # --- capacity. `free` reports the host's, so the cgroup limit is the number
              #     that matters against the guest's 16 GiB.
              f nproc "$(nproc)"
              f mem_total_gb "$(awk '/MemTotal/{printf "%d", $2/1048576}' /proc/meminfo)"
              f mem_avail_gb "$(awk '/MemAvailable/{printf "%d", $2/1048576}' /proc/meminfo)"
              f cgroup_mem_max "$(cat /sys/fs/cgroup/memory.max 2>/dev/null \
                                || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null \
                                || echo unknown)"

              f statedir "$(QDB_VMCRASH_STATE)"
              f statedir_free_gb "$(df -BG --output=avail "$(QDB_VMCRASH_STATE)" 2>/dev/null | tail -1 | tr -dc '0-9')"
              f home_free_gb "$(df -BG --output=avail "$HOME" 2>/dev/null | tail -1 | tr -dc '0-9')"
              [ -d "$(MAVEN_CACHE_FOLDER)" ] && f home_persists likely || f home_persists unknown
              # The decisive one for persistence, and home_persists is NOT a proxy for it: the
              # agent containers are ephemeral, one per job, so $HOME never survives. Only the
              # mounted state dir does, and only while the Ansible device is applied.
              if command -v mountpoint >/dev/null 2>&1 && mountpoint -q "$(QDB_VMCRASH_STATE)"; then
                f statedir_is_mount yes
              else
                f statedir_is_mount no
              fi
              [ -f "$(QDB_VMCRASH_STATE)/base/golden.qcow2" ] && f golden_image present || f golden_image absent
              df -BG "$(QDB_VMCRASH_STATE)" "$HOME" / 2>&1 | sed 's/^/  /' || true

              for u in "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img" \
                       "https://api.adoptium.net/v3/info/available_releases"; do
                code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 -I "$u" 2>/dev/null || echo 000)
                f "egress_$(echo "$u" | awk -F/ '{print $3}' | tr . _)" "$code"
              done

              # --- the decisive test: QEMU with the harness's own -smp/-m, and
              #     -mem-prealloc so a cgroup limit fails here rather than mid-workload.
              if command -v qemu-system-x86_64 >/dev/null 2>&1; then
                f qemu_version "$(qemu-system-x86_64 --version 2>/dev/null | head -1 | awk '{print $4}')"
                if timeout 60 qemu-system-x86_64 -enable-kvm -smp 1 -m 128M -S -no-user-config \
                     -nodefaults -display none -monitor none >/dev/null 2>&1; then
                  f qemu_kvm_smoke_small pass
                else
                  f qemu_kvm_smoke_small fail
                fi
                if timeout 60 qemu-system-x86_64 -enable-kvm -cpu host -smp 8 -m 16G -mem-prealloc \
                     -S -no-user-config -nodefaults -display none -monitor none >/dev/null 2>&1; then
                  f qemu_kvm_smoke_harness pass
                else
                  f qemu_kvm_smoke_harness fail
                fi
              else
                f qemu_version absent
                f qemu_kvm_smoke_small fail
                f qemu_kvm_smoke_harness fail
              fi
              echo "##[endgroup]"
            displayName: "Agent capability facts (answers what the probe would have)"
            timeoutInMinutes: 10
            condition: and(succeededOrFailed(), ne(variables['DURABILITY_SKIP'], 'true'))

          # 2. THE GATE. check-host.sh has the last word and names the first missing
          #    prerequisite. No KVM, no run.
          - bash: |
              set -uo pipefail
              cd tools/durability/vm
              if bash check-host.sh; then
                echo "##vso[task.setvariable variable=DURABILITY_AGENT_READY]true"
              else
                echo "##vso[task.setvariable variable=DURABILITY_AGENT_READY]false"
                cat <<'BANNER'
              ================================================================================
              DURABILITY AGENT CAPABILITY: NOT READY

              This is NOT a durability failure. Nothing about the product was measured. The
              open question -- whether this pool's containers can run a VM at all -- has just
              been answered by the first real run, which is what this run was for. Read the
              cause above and the QDB_AGENT block earlier in this log.

              There is NO slow fallback to rule out. lib/qemu.sh passes -enable-kvm
              unconditionally, so without a usable /dev/kvm qemu REFUSES TO START; it does not
              silently degrade to TCG emulation and produce slow, timing-shifted, still-green
              results. The harness hard-fails by design.

              NEXT DECISION, by cause:
                no /dev/kvm, or present but not rw without sudo
                    -> if it is a permissions problem, one agent-image fix settles it:
                       setfacl -m u:<agent>:rw /dev/kvm, or add the agent user to the kvm group.
                    -> if KVM is genuinely unavailable in an incus container on this pool, the
                       VM design is dead here. Two options remain: a VM-free dm-log-writes
                       backend, which needs dm_log_writes on the HOST kernel and real root
                       (see mod_dm_log_writes_* and cap_sys_admin in the QDB_AGENT block), or
                       a dedicated bare-metal agent. Both are Eugene's decision. Do not
                       silently take either.
                < 200 G free at the state dir
                    -> point QDB_VMCRASH_STATE at a larger mount, or revisit the gate itself
                       (the per-run disks are sparse, so the gate is conservative). Changing
                       the gate is a HARNESS edit and its own ticket.
                missing qemu/genisoimage
                    -> the apt install step above failed, or the mirrors lack universe.
              ================================================================================
              BANNER
                echo "##vso[task.logissue type=error]AGENT CANNOT RUN VMS — check-host.sh refused this agent. Infrastructure answer, not a durability result; see the banner above."
                mkdir -p "$(DURABILITY_RESULTS)"
                cat > "$(DURABILITY_RESULTS)/agent.xml" <<XML
              <?xml version="1.0" encoding="UTF-8"?>
              <testsuites><testsuite name="durability.agent" tests="1" failures="0" skipped="0" errors="1" time="0">
                <testcase classname="durability.agent" name="capability">
                  <error message="check-host.sh refused this agent; no measurement was taken" type="AGENT_NOT_READY"/>
                </testcase>
              </testsuite></testsuites>
              XML
                exit 1
              fi
              # Equals form only: reap-state.sh rejects "--state DIR" with exit 64.
              bash reap-state.sh --state="$(QDB_VMCRASH_STATE)" || true
            displayName: "GATE: check-host.sh (no KVM, no run)"
            timeoutInMinutes: 5
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'))

          # 3. THE GOLDEN IMAGE. Built only in provision mode, or when missing and there is
          #    room: a nightly that spends its window rebuilding it measures nothing.
          - bash: |
              set -uo pipefail
              source "$(Agent.TempDirectory)/durability-budget.sh"
              GOLDEN="$(QDB_VMCRASH_STATE)/base/golden.qcow2"
              cd tools/durability/vm

              if [ -f "$GOLDEN" ] && [ "${{ parameters.durabilityMode }}" != "provision" ]; then
                echo "golden image present: $(du -h "$GOLDEN" | cut -f1) — reusing"
                echo "##vso[task.setvariable variable=DURABILITY_IMAGE_FRESH]false"
                exit 0
              fi

              if [ "${{ parameters.durabilityMode }}" != "provision" ]; then
                echo "##vso[task.logissue type=warning]no golden image on this agent; provisioning instead of measuring. This run takes NO measurement."
              fi
              if ! phase_fits 35; then
                echo "##vso[task.logissue type=error]no golden image and only $(( $(remaining) / 60 ))m of budget; queue this pipeline manually with durabilityMode=provision outside the window"
                exit 1
              fi
              run_phase build-image 35 bash build-image.sh || exit 1
              echo "##vso[task.setvariable variable=DURABILITY_IMAGE_FRESH]true"
            displayName: "Golden image (build only if missing, or durabilityMode=provision)"
            timeoutInMinutes: 45
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'))

          - bash: |
              set -uo pipefail
              source "$(Agent.TempDirectory)/durability-budget.sh"
              cd tools/durability/vm
              # Image acceptance, not a durability control: without it a missing guest
              # module surfaces much later as "could not build the log-writes stack".
              run_phase t01-golden-image 5 bash test/t01-golden-image.sh
            displayName: "t01 — accept the golden image (fresh images only)"
            timeoutInMinutes: 15
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'), eq(variables['DURABILITY_IMAGE_FRESH'], 'true'))

          # 4. THE BUILD. benchmarks.jar is what every arm ships into the guest; the core
          #    release tarball is what the product arm tests.
          - template: templates/detect-local-client.yml
          # ^ Not optional: benchmarks needs a questdb-client SNAPSHOT that Maven Central
          #   does not have. The other jobs get this via steps.yml, which this job omits.

          - template: templates/build-client-native.yml
          # ^ Also not optional, and for the same reason: steps.yml carries it and this job
          #   omits steps.yml. The client submodule does not commit libquestdb.so, and no pom
          #   builds it -- CMake does, from this template. Without it the reactor produces a
          #   client jar with no native library, the build stays green, and the PRODUCT arm
          #   dies at class load inside the guest:
          #     FatalError: cannot find /io/questdb/client/bin/linux-x86-64/libquestdb.so
          #   which the sweep reports as "no commit in 24s" -- indistinguishable from host
          #   contention, and the contention reading is the one the pool invites (build
          #   270618). The reference arms never touch the client, so they pass either way.
          #
          #   The template has its own conditions and cannot take ours, so a provision run
          #   pays ~2 minutes for a native library it will not use. That is cheap next to
          #   another 14-minute run that measures two arms out of three.

          - bash: |
              set -uo pipefail
              python3 .github/prepare_rust_env.py --export-cargo-install-env --match core/rust/qdbr/rust-toolchain.toml
            displayName: "Ensure Rust is installed"
            timeoutInMinutes: 15
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'), ne('${{ parameters.durabilityMode }}', 'provision'))

          - bash: |
              set -uo pipefail
              source "$(Agent.TempDirectory)/durability-budget.sh"
              # One pass, both artifacts: benchmarks.jar for every arm, and the no-jre
              # tarball the product arm runs. The harness never assembles one itself.
              run_phase build-artifacts 30 \
                mvn -f pom.xml -s ci/maven-settings-hetzner.xml \
                  --batch-mode -pl benchmarks,core -am package \
                  -P build-binaries $(CLIENT_PROFILE) -P qdbr-release \
                  -Dmaven.test.skip=true $(MAVEN_RUN_OPTS) || exit 1

              test -f benchmarks/target/benchmarks.jar || {
                echo "##vso[task.logissue type=error]benchmarks/target/benchmarks.jar was not produced"; exit 1; }
              ls -la benchmarks/target/benchmarks.jar
              n=$(find core/target -maxdepth 1 -name 'questdb-*-no-jre-bin.tar.gz' | wc -l)
              find core/target -maxdepth 1 -name 'questdb-*-no-jre-bin.tar.gz' -ls
              [ "$n" -eq 1 ] || {
                echo "##vso[task.logissue type=error]expected exactly 1 no-jre release tarball in core/target, found $n — the product arm refuses an ambiguous target dir"; exit 1; }

              # Asserted on the jar that ships into the guest, not on the source tree it was
              # built from: the shade step is between the two, and the product arm loads this
              # library at class load. A jar without it builds green and fails four minutes
              # into the product sweep, wearing the mask of host contention (build 270618).
              if [ -n "$(CLIENT_PROFILE)" ]; then
                if "${JAVA_HOME}/bin/jar" tf benchmarks/target/benchmarks.jar \
                     | grep -q '^io/questdb/client/bin/linux-x86-64/libquestdb\.so$'; then
                  echo "client native library present in benchmarks.jar"
                else
                  echo "##vso[task.logissue type=error]benchmarks.jar carries no io/questdb/client/bin/linux-x86-64/libquestdb.so. The local-client reactor built a client jar the product arm cannot load; templates/build-client-native.yml must run, and its steps need os=Linux."
                  exit 1
                fi
              fi
            displayName: "Build benchmarks.jar + release tarball"
            timeoutInMinutes: 40
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'), ne('${{ parameters.durabilityMode }}', 'provision'))

          # 5. THE CONTROLS, FIRST AND UNCONDITIONALLY. A sweep whose controls did not run
          #    that night is not evidence: they run before the sweeps so deadline trimming
          #    falls on the sweeps, and a red control aborts them. A verdict from an
          #    instrument known to be broken is worse than none, because it gets cited.
          #      t06 boundaries discriminate   t07 the oracle can fail
          #      t10 the barrier control       t08 the reaper keeps what it must
          #      t09 the report is honest      t11 the env builders agree
          #      t12 a verdict token means one thing
          - bash: |
              set -uo pipefail
              source "$(Agent.TempDirectory)/durability-budget.sh"
              cd tools/durability/vm
              rc=0
              # Seconds for the lot: the self-tests check the judging logic of the two most
              # expensive VM controls below, t11 the builders they are configured by.
              run_phase t10-judge-selftest 2 bash test/t10-wal-barrier-control.sh --self-test || rc=1
              run_phase t06-selftest       2 bash test/t06-log-writes-replay.sh --self-test   || rc=1
              run_phase t11-builder-parity 2 bash test/t11-builder-parity.sh                  || rc=1
              run_phase t12-verdict-vocab  2 bash test/t12-verdict-vocabulary.sh              || rc=1
              run_phase t08-state-reaper   2 bash test/t08-state-reaper.sh                    || rc=1
              run_phase t09-junit-xml      2 bash test/t09-junit-xml.sh                       || rc=1

              # As load-bearing as the VM controls, so they gate the sweeps the same way.
              for t in t10-judge-selftest t06-selftest t11-builder-parity t12-verdict-vocab \
                       t08-state-reaper t09-junit-xml; do
                grep -q "^$t .* rc=0$" "$(Agent.TempDirectory)/durability-timing.txt" 2>/dev/null \
                  || { echo "VM-free control did not complete: $t"; rc=1; }
              done
              exit $rc
            displayName: "Controls: judges, builders, vocabulary, reaper, report (no VM)"
            timeoutInMinutes: 10
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'), ne('${{ parameters.durabilityMode }}', 'provision'))

          - bash: |
              set -uo pipefail
              source "$(Agent.TempDirectory)/durability-budget.sh"
              cd tools/durability/vm
              rc=0
              # t06 first: if replay to boundary N leaks later writes, every verdict below
              # is fiction.
              run_phase t06-log-writes-replay 8  bash test/t06-log-writes-replay.sh      || rc=1
              run_phase t07-oracle-control    10 bash test/t07-oracle-negative-control.sh || rc=1
              run_phase t10-barrier-control    15 bash test/t10-wal-barrier-control.sh    || rc=1

              # A control skipped by the deadline is not a control either, and run_phase
              # returns 0 on a skip -- so "did every control run" is asserted separately.
              complete=true
              for t in t06-log-writes-replay t07-oracle-control t10-barrier-control; do
                if ! grep -q "^$t .* rc=0$" "$(Agent.TempDirectory)/durability-timing.txt" 2>/dev/null; then
                  echo "control did not complete: $t"
                  complete=false
                fi
              done
              echo "##vso[task.setvariable variable=DURABILITY_CONTROLS_COMPLETE]$complete"

              if [ $rc -ne 0 ]; then
                echo "##vso[task.logissue type=error]a CONTROL failed. The sweeps are skipped: a durability verdict from an instrument that cannot be trusted reads as evidence, which is worse than no verdict."
              elif [ "$complete" != true ]; then
                echo "##vso[task.logissue type=warning]a control was cut by the pre-nightly deadline; the sweeps are skipped. A sweep whose controls did not run that night is not evidence."
              fi
              exit $rc
            displayName: "Controls: t06 boundaries, t07 oracle, t10 barrier (VM)"
            timeoutInMinutes: 45
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'), ne('${{ parameters.durabilityMode }}', 'provision'))

          # 6. THE SWEEPS. Three arms of one experiment, each its own step and JUnit suite:
          #      reference W=0      — the zero-loss bar, F >= C
          #      reference W=50000  — the RPO bar, F >= Wm, loss confined to (Wm, C]
          #      product   W=50000  — the same bar on the shipped tarball, as a JPMS module
          #    Leave QDB_REPLAY_RESET and QDB_VM_DATA_DISCARD unset: the sweep resets the data
          #    device itself and asserts the reset is real, qemu's default discard=ignore
          #    accepting a discard and reverting nothing.
          - bash: |
              set -uo pipefail
              source "$(Agent.TempDirectory)/durability-budget.sh"
              cd tools/durability/vm
              mkdir -p "$(DURABILITY_RESULTS)"
              REF=${{ parameters.refPoints }}
              PROD=${{ parameters.productPoints }}
              MTX=${{ parameters.matrixPoints }}
              if [ "${{ parameters.durabilityMode }}" = "smoke" ]; then
                REF=10; PROD=3; [ "$MTX" -gt 4 ] && MTX=4
                echo "smoke mode: refPoints=$REF productPoints=$PROD matrixPoints=$MTX — this run MEASURES, it does not certify"
              fi
              rc=0

              # NOTHING IN THIS HARNESS IS RANDOM, so a nightly job has to be made to explore
              # on purpose. The workload writes v = id * 2654435761 with no seed -- the
              # identity oracle depends on that -- and the crash points are a fixed
              # arithmetic sequence from a fixed floor at 10% of the recording. Run the same
              # configuration every night with the same offset and you re-run one experiment
              # and file the result as coverage.
              #
              # QDB_SWEEP_OFFSET, below, shifts the start within one stride. Driven by the
              # build id it moves every run, so night N samples a different residue class and
              # the union over `stride` nights is every boundary in the span. Measured on a
              # 4808-boundary recording at 10 points: five fixed-offset nights sample 11
              # distinct boundaries, five build-id nights sample 55.
              #
              # The other half of the exploration is already there and is not ours to steer:
              # the recording differs run to run because flush timing does (4808, 4988 and
              # 3933 boundaries across three consecutive builds), and run-flush-sweep.sh
              # densifies around any failure it finds, re-verifying f-2, f-1 and f+1.

              # Cells that reproduce an OPEN, RECORDED product defect. They run every night
              # -- the code under them is worth testing and the finding is worth re-measuring
              # -- but their failure is expected and does not fail the job, or the battery is
              # red every night for something already known and nobody reads it again.
              #
              # rewrite-mat-view is dimension 15, documented in tools/durability/vm/README.md:
              # after a crash the base correctly discards the txns the RPO window permits it
              # to lose, while the view keeps aggregates derived from those same txns and
              # still reports view_status=valid. The README argues it is permanent --
              # incremental refresh only moves forward from a watermark already above the
              # base, and the invalidation path is gated on a TRUNCATE barrier that a crash
              # rollback is not.
              #
              # rewrite-mat-view-control is the other half of that finding and is NOT expected
              # to fail: at mode=sync, W=0, Wm==C, there is no window for the view to lead
              # and the defect does not appear. If the control ever fails, the defect is not
              # what the README says it is.
              #
              # An expected failure that starts PASSING fails the run. Either the defect is
              # fixed -- remove the cell from this list -- or the cell stopped exercising it,
              # and a known defect that silently stops reproducing is how a test quietly
              # becomes decoration.
              KNOWN_DEFECTS="rewrite-mat-view"

              # Half depth for the extra window sizes: the bar they test is the same one the
              # W=50000 cell tests at full depth, and what they add is the second and third
              # point on the curve, not more samples of one point.
              REF_W=$(( REF / 2 )); [ "$REF_W" -lt 4 ] && REF_W=4

              # THE CELL TABLE.  name|arm|mode|window_us|points|extra env
              #
              # Two claims, their controls, and nothing else. An earlier revision ran a cell
              # per dimension of the harness's coverage table -- profiles, sync/nosync, DDL,
              # sibling tables, lazy gap, rebase. Those are covered by the modelled Java
              # crash suite and they were spending window that the claims this branch makes
              # should be spending. They are deleted here, not disabled: the harness still
              # takes every one of those knobs, and `bash run-flush-sweep.sh` with the
              # matching QDB_* variable runs any of them by hand when a question needs it.
              #
              # Order is the budget policy. run_phase refuses a phase that cannot finish
              # before the pre-nightly deadline and records it as skipped, so trimming always
              # falls on the TAIL of this list: each claim's central cell comes first, its
              # control next, and the curve extras last.
              #
              # THE CLAIM UNDER TEST, in the order the cells establish it:
              #
              #   1. W=0: nothing acked is ever lost.  Verdict DURABLE (F >= C). This is the
              #      control for 2 -- if it fails, the window is not what caused the loss.
              #
              #   2. W>0: loss is confined to the window.  Verdict RPO_OK: every ACKED txn
              #      survived and loss is confined to (Wm, C]. One window size proves the
              #      rule holds; it does not prove the bound TRACKS W, which is the actual
              #      product claim. Three sizes -- 5 ms, 50 ms, 200 ms -- make a curve, and a
              #      bound that ignores W shows up as the same loss at every size. The two
              #      extra sizes are last because the 50 ms cell is the one with history.
              #
              #   3. The same bar over the wire, server alone.  Arm qwp: the server tracks
              #      and recovers, the client contributes nothing. This is the control that
              #      isolates 4 -- without it, "no loss" in 4 cannot be attributed to the
              #      client rather than to the server having dropped nothing.
              #
              #   4. The client closes the window.  Arm qwp-sf: the client requests the LOCAL
              #      durable-ack tier and holds un-acked rows in a store-and-forward buffer
              #      ON THE CRASHED DEVICE, then replays after recovery. QDB_SF_REPLAY=compare
              #      verifies each boundary TWICE -- server alone, then after the replay --
              #      and reports the delta, so "lost=0" cannot be read as "nothing was at
              #      risk here". Arm product is this same claim on the shipped tarball,
              #      launched as a named JPMS module by the real questdb.sh.
              #
              # Everything from the matrix block down is breadth: one cell per remaining
              # dimension of the harness's coverage table (tools/durability/vm/README.md),
              # which claims 17 of 17 and until recently had 3 of 17 running here.
              #
              # The mat-view pair sits between the claims and the curve extras: it is the one
              # cell here that is not part of either claim, kept because the code under it is
              # worth a nightly crash and its finding is worth re-measuring.
              #
              # QDB_JUNIT_SUITE_SUFFIX is not decoration. The harness names a suite
              # durability.<arm>.<mode>.W<window>.<profile>, and the mat-view cell shares all
              # four fields with the W=50000 sweep above it -- so without a suffix they
              # publish as one suite, mergeTestResults folds them together, and their flush-N
              # cases collide.
              CELLS="
              sweep-reference-W50000|reference|adaptive|50000|$REF|
              sweep-reference-W0|reference|adaptive|0|$REF|
              sweep-qwp-sf-W50000|qwp-sf|adaptive|50000|$PROD|
              sweep-qwp-W50000|qwp|adaptive|50000|$PROD|
              sweep-product-W50000|product|adaptive|50000|$PROD|
              sweep-reference-W5000|reference|adaptive|5000|$REF_W|
              sweep-reference-W200000|reference|adaptive|200000|$REF_W|
              "

              # THE REWRITE BLOCK. Everything above ingests by appending to the tail of one
              # plain table. That is the least demanding thing the storage engine does, and a
              # battery that only does it certifies the easy path. Each cell below forces the
              # engine to REWRITE files rather than extend them, which is where a power cut
              # has something to tear:
              #
              #   o3          every 4th row lands below the running max timestamp, so each
              #               commit engages the O3 MERGE path and rewrites partitions
              #               instead of appending to them
              #   bitmap      .k/.v index files, rewritten per commit
              #   posting     posting-list index structures
              #   covering    posting index carrying a copy of v
              #   varchar     aux vector with per-row variable offsets -- the torn-aux-tail
              #   array       same shape, length varying 0..9 per row
              #   wide        twelve columns touched on every commit
              #   ddl         addColumn mid-ingest. Adaptive CANNOT apply this lazily: it is a
              #               one-shot metadata write with no epoch behind it, so it takes the
              #               SYNC grade and its ordering against the data is load-bearing. A
              #               cut between the column file appearing and the segment metadata
              #               naming it leaves a segment that can never be applied
              #   mat-view    mat views in EVERY refresh type over one base -- IMMEDIATE,
              #               TIMER, MANUAL, PERIOD, DEFERRED -- so one crash exercises all
              #               of their state files and watermarks
              #   sibling     a second WAL table, so RecoveryCoordinator's per-table loop runs
              #               more than once and both tables recover in a single pass
              #   lazygap     no epoch interval: the widest possible gap between committed
              #               and durable
              #   recoveras   restart under a different global commit mode, so recovery must
              #               decide from the durable enrolment record and not from the mode
              #               it finds
              #   rebase      REBASE WAL publish: hard-suspend, rebase, idle -- tail-sampled,
              #               since the rebase is the last recorded activity, not spread
              #               through the recording.
              #
              # The block is ROTATED by build id. Sized to fit, it runs whole; on a night
              # that starts late the deadline trims the tail, and without rotation the same
              # cells would be the ones dropped every time.
              DIMS=""
              if [ "$MTX" -gt 0 ]; then
                DIMS="
              rewrite-o3|reference|adaptive|0|$MTX|QDB_SCHEMA_PROFILE=o3
              rewrite-mat-view|reference|adaptive|50000|$MTX|QDB_MAT_VIEW=true QDB_JUNIT_SUITE_SUFFIX=matview
              rewrite-mat-view-control|reference|sync|0|$MTX|QDB_MAT_VIEW=true QDB_JUNIT_SUITE_SUFFIX=matview
              rewrite-ddl-add-column|reference|adaptive|50000|$MTX|QDB_DDL_EVERY_ROWS=50000 QDB_JUNIT_SUITE_SUFFIX=ddl
              rewrite-profile-varchar|reference|adaptive|0|$MTX|QDB_SCHEMA_PROFILE=varchar
              rewrite-profile-array|reference|adaptive|0|$MTX|QDB_SCHEMA_PROFILE=array
              rewrite-profile-wide|reference|adaptive|0|$MTX|QDB_SCHEMA_PROFILE=wide
              rewrite-profile-posting|reference|adaptive|0|$MTX|QDB_SCHEMA_PROFILE=posting
              rewrite-profile-covering|reference|adaptive|0|$MTX|QDB_SCHEMA_PROFILE=covering
              rewrite-profile-none|reference|adaptive|0|$MTX|QDB_SCHEMA_PROFILE=none
              rewrite-sibling-table|reference|adaptive|50000|$MTX|QDB_SIBLING_TABLE=true QDB_JUNIT_SUITE_SUFFIX=sibling
              rewrite-lazy-gap|reference|adaptive|50000|$MTX|QDB_EPOCH_MS=-1 QDB_JUNIT_SUITE_SUFFIX=lazygap
              rewrite-recover-as-nosync|reference|adaptive|50000|$MTX|QDB_RECOVER_AS=nosync QDB_JUNIT_SUITE_SUFFIX=recoveras
              rewrite-rebase-wal|reference|adaptive|50000|$MTX|QDB_REBASE_AT_ROWS=5000 QDB_SWEEP_MODE=tail QDB_JUNIT_SUITE_SUFFIX=rebase
              "
                n=$(printf '%s\n' "$DIMS" | grep -c '|')
                if [ "$n" -gt 0 ]; then
                  DIMS=$(printf '%s\n' "$DIMS" | grep '|' \
                         | awk -v s="$(( $(Build.BuildId) % n ))" \
                               '{a[NR]=$0} END{for(i=0;i<NR;i++) print a[((i+s)%NR)+1]}')
                fi
              fi
              CELLS="$CELLS
              $DIMS
              "

              # fd 3, not stdin: a stdin reader in the loop body must not drain the table.
              listed=$(printf '%s\n' "$CELLS" | grep -c '|')
              iterated=0
              while IFS='|' read -r -u 3 name arm mode win pts extra; do
                name=$(echo "$name" | tr -d '[:space:]')
                [ -z "$name" ] && continue
                iterated=$((iterated + 1))
                arm=$(echo "$arm" | tr -d '[:space:]'); mode=$(echo "$mode" | tr -d '[:space:]')
                win=$(echo "$win" | tr -d '[:space:]'); pts=$(echo "$pts" | tr -d '[:space:]')
                # Per-arm cost, measured on this agent by build 270631: 4.8 s per reference
                # boundary and 22.8 s per product boundary, both under a concurrent soak, so
                # both are upper bounds. Rounded up to 7 and 25.
                #
                # The fixed part is 2 minutes, not the 4 this used to carry: the measured
                # per-cell fixed cost (record the workload, boot, build the log-writes
                # stack) is ~45 s. 4 minutes was harmless for three sweeps and is not
                # harmless for nineteen -- it would reserve an hour of window that nothing
                # spends, and phase_fits would skip cells that would have finished. An
                # over-estimate is not free. It is also not the safety mechanism: run_phase
                # wraps every cell in `timeout $(remaining)s`, so a cell that outlives the
                # budget is cut cleanly and recorded as skipped, never as a failure.
                case "$arm" in
                  product|qwp|qwp-sf) sec=25 ;;
                  *)                  sec=7  ;;
                esac
                need=$(( 2 + (pts * sec + 59) / 60 ))
                # $extra is deliberately unquoted: it carries zero or more KEY=VALUE words
                # for env, and quoting would pass the whole string as one argument.
                # shellcheck disable=SC2086
                run_phase "$name" "$need" \
                  env QDB_ARM="$arm" QDB_SWEEP_POINTS="$pts" QDB_SWEEP_OFFSET="$(Build.BuildId)" \
                      QDB_JUNIT_XML="$(DURABILITY_RESULTS)/${name}.xml" \
                      QDB_SWEEP_LOG="$(DURABILITY_RESULTS)/flush-sweep.log" $extra \
                      bash run-flush-sweep.sh "$mode" "$win"
                cell_rc=$?

                known=false
                case " $KNOWN_DEFECTS " in *" $name "*) known=true ;; esac
                if [ "$known" = true ] \
                   && { [ "${{ parameters.tolerateKnownDefects }}" = "True" ] || [ "${{ parameters.tolerateKnownDefects }}" = "true" ]; }; then
                  if [ $cell_rc -ne 0 ]; then
                    echo "##vso[task.logissue type=warning]$name failed as expected: it reproduces an open finding recorded in tools/durability/vm/README.md. Its verdicts are published; it does not fail this run."
                  # run_phase returns 0 for a skip and for a deadline cut as well as for a
                  # pass, so "it passed" has to come from the timing record, not the code.
                  elif grep -q "^$name .* rc=0$" "$(Agent.TempDirectory)/durability-timing.txt" 2>/dev/null; then
                    echo "##vso[task.logissue type=error]$name PASSED, and it is listed as a known defect that must fail. Either the defect is fixed -- take it out of KNOWN_DEFECTS in ci/test-fuzz-adaptive.yml -- or the cell has stopped exercising it."
                    rc=1
                  fi
                elif [ $cell_rc -ne 0 ]; then
                  rc=1
                fi
              done 3<<CELLS_EOF
              $CELLS
              CELLS_EOF
              # Fail loudly on a count mismatch: an unrun cell must not report green.
              if [ "$iterated" -ne "$listed" ]; then
                echo "##vso[task.logissue type=error]$listed cells in the table but the loop iterated $iterated; a stdin reader in the loop body ended it early and the unrun cells were reporting green"
                rc=1
              fi
              exit $rc
            displayName: "Sweeps: reference W=0, reference W=50000, product W=50000"
            timeoutInMinutes: 75
            # DURABILITY_CONTROLS_COMPLETE is the teeth behind "a sweep whose controls did
            # not run is not evidence": succeeded() alone lets a deadline-cut control through,
            # a clean cut deliberately not being a failure.
            condition: and(succeeded(), ne(variables['DURABILITY_SKIP'], 'true'), ne('${{ parameters.durabilityMode }}', 'provision'), eq(variables['DURABILITY_CONTROLS_COMPLETE'], 'true'))

          # 7. STAGE THE EVIDENCE. always(): a failed run is when it is worth having.
          - bash: |
              set -uo pipefail
              S="$(QDB_VMCRASH_STATE)"
              D="$(DURABILITY_RESULTS)"
              mkdir -p "$D/sweep-out" "$D/evidence"

              # Never the disks, and an include list: an exclude list would start uploading
              # gigabytes the day a new artifact kind appears.
              M="$(Agent.TempDirectory)/durability-started.marker"
              newer=(); [ -f "$M" ] && newer=(-newer "$M")
              find "$S/sweep-out" -type f \
                   \( -name '*.xml' -o -name '*.out' -o -name '*.log' \) \
                   "${newer[@]+"${newer[@]}"}" \
                   -exec cp --parents -t "$D/sweep-out" {} + 2>/dev/null || true
              if [ -d "$S/evidence" ]; then
                find "$S/evidence" -type f \
                     \( -name 'cmdline' -o -name 'console.log' -o -name 'liveness-failure.out' \) \
                     "${newer[@]+"${newer[@]}"}" \
                     -exec cp --parents -t "$D/evidence" {} + 2>/dev/null || true
              fi

              {
                echo "=== TIMING (seconds per phase, measured ON THIS AGENT) ==="
                cat "$(Agent.TempDirectory)/durability-timing.txt" 2>/dev/null || echo "(none)"
                echo
                echo "=== NOT RUN ==="
                if [ -s "$(Agent.TempDirectory)/durability-skipped.txt" ]; then
                  cat "$(Agent.TempDirectory)/durability-skipped.txt"
                else
                  echo "(nothing skipped — the whole battery ran)"
                fi
              } | tee "$D/timing.txt"

              # Assert what the publish step believes: a cut arm leaves no report, because
              # the sweep's INT/TERM handlers exit rather than return. A handler that returned
              # would let the loop run on against a dead guest and publish failures nobody
              # measured, and the publisher globs every XML it finds.
              while IFS= read -r skipped; do
                case "$skipped" in
                  *"(cut at the deadline)"*)
                    arm="${skipped%% *}"
                    found=$(find "$D" -name "${arm}*.xml" 2>/dev/null)
                    if [ -n "$found" ]; then
                      echo "##vso[task.logissue type=error]$arm was cut at the deadline but published a report: $found"
                      echo "##vso[task.logissue type=error]those boundaries were not measured; the report must not reach the dashboard"
                      rm -f $found
                      exit 1
                    fi ;;
                esac
              done < "$(Agent.TempDirectory)/durability-skipped.txt"

              sz=$(du -sm "$D" | cut -f1)
              echo "staged evidence: ${sz} MB"
              if [ "${sz:-0}" -gt 300 ]; then
                echo "##vso[task.logissue type=warning]staged evidence is ${sz} MB (> 300 MB cap); dropping per-boundary .out files, keeping XML and logs"
                find "$D/sweep-out" -type f -name '*.out' -delete
                du -sm "$D"
              fi
              # sed, not head: sed reads to EOF, so ls cannot die of SIGPIPE.
              ls -R "$D" | sed -n '1,60p'
            displayName: "Stage evidence (XML, per-boundary output, logs — never the disks)"
            timeoutInMinutes: 10
            condition: always()

          - task: PublishTestResults@2
            displayName: "Publish durability results"
            # succeededOrFailed(): a sweep killed mid-flight leaves no file for that arm,
            # which the staging step above asserts rather than trusts.
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "$(DURABILITY_RESULTS)/**/*.xml"
              testRunTitle: "durability VM flush-boundary ($(Build.SourceBranchName))"
              mergeTestResults: true
              failTaskOnFailedTests: false

          - task: PublishBuildArtifacts@1
            displayName: "Upload durability evidence"
            condition: always()
            inputs:
              pathToPublish: $(DURABILITY_RESULTS)
              artifactName: "DurabilityEvidence"

          # 8. REAP, after the upload and never before: a reaper that deletes first has
          #    destroyed the thing the artifact was for. It must also run when the sweep
          #    failed, failures keeping their disks by design.
          - bash: |
              set -uo pipefail
              # Kill our VMs first: reap-state.sh keeps any directory whose qemu.pid lives.
              if pgrep -af 'qemu.*qdb-vmcrash'; then
                echo "killing VMs still alive at teardown"
                pkill -f 'qemu.*qdb-vmcrash' || true
                sleep 3
                pkill -9 -f 'qemu.*qdb-vmcrash' || true
              fi
              cd tools/durability/vm 2>/dev/null || cd "$(Build.SourcesDirectory)/tools/durability/vm"
              # The equals form is mandatory: the space form exits 64, so the reap would
              # silently never run and the disk would fill. --keep=3 is enough kept disks to
              # diagnose a regression; --keep-days=14 ages out the archives, which are never
              # reaped by count.
              bash reap-state.sh --state="$(QDB_VMCRASH_STATE)" --keep=3 --keep-days=14 --apply || \
                echo "##vso[task.logissue type=warning]reap-state.sh exited $? (64=refused, 70=an rm failed); check free space before the next run"
              df -BG "$(QDB_VMCRASH_STATE)" | sed 's/^/  /'
            displayName: "Kill stray VMs, then reap state (after upload, always)"
            timeoutInMinutes: 10
            condition: always()

          - bash: |
              set -uo pipefail
              rm -rf "$(QDB_VMCRASH_STATE)/.durability-ci.lock" && echo "lock released"
              # An overrun past the nightly's cron is an incident on a one-agent pool, and
              # invisible unless the run that caused it says so. 10# forces base 10: %H%M
              # emits a leading zero and bash reads 0100 as octal.
              now_hm=$((10#$(date -u +%H%M)))
              if [ "$now_hm" -ge 100 ] && [ "$now_hm" -lt 600 ]; then
                echo "##vso[task.logissue type=error]this build was still running at $(date -u +%H:%M) UTC, past the 01:00 nightly cron. It has delayed the nightly on a one-agent pool. Tighten DURABILITY_DEADLINE_UTC or reduce the point counts."
              fi
            displayName: "Release lock; flag any overrun past the nightly"
            timeoutInMinutes: 5
            condition: always()

      - job: NotifyOnFailure
        displayName: "Notify Slack on failure"
        # The notify job stays on the soak pool too; RunOn has released its
        # agent by the time this job queues.
        pool: hetzner-adaptive-commit-fuzz
        dependsOn:
          - RunContinuousSoak
          - RunAdaptiveCrashNightly
          - RunFullSuiteNightly
          # A red durability night raises the same alarm. failed() is true when any
          # dependency failed; jobs skipped on a given schedule are not failures.
          - RunDurabilitySweep
        condition: failed()
        variables:
          # Which job failed. With four jobs on one definition the alert title alone is
          # ambiguous, and a durability red needs a different response from a fuzz red.
          RESULT_SOAK: $[ dependencies.RunContinuousSoak.result ]
          RESULT_CRASH_NIGHTLY: $[ dependencies.RunAdaptiveCrashNightly.result ]
          RESULT_FULL_SUITE: $[ dependencies.RunFullSuiteNightly.result ]
          RESULT_DURABILITY: $[ dependencies.RunDurabilitySweep.result ]
        steps:
          - checkout: none

          - task: CmdLine@2
            displayName: Notify Slack on Failure
            inputs:
              script: |
                # While the secret variable is missing from the pipeline
                # settings, the env mapping below passes the macro through
                # unexpanded; skip instead of curl-ing a literal "$(...)".
                case "$TMP_ADAPTIVE_COMMIT_ALERT_WEBHOOK" in
                  '' | '$('*)
                    echo "TMP_ADAPTIVE_COMMIT_ALERT_WEBHOOK is not configured; skipping Slack alert"
                    exit 0
                    ;;
                esac
                # Name the failing job: a red soak or nightly is a product or test failure,
                # while a red durability run may be the instrument, or the agent being unable
                # to run a VM at all.
                FAILED=""
                [ "$RESULT_SOAK" = Failed ]          && FAILED="$FAILED soak"
                [ "$RESULT_CRASH_NIGHTLY" = Failed ] && FAILED="$FAILED adaptive-crash-nightly"
                [ "$RESULT_FULL_SUITE" = Failed ]    && FAILED="$FAILED full-suite-nightly"
                [ "$RESULT_DURABILITY" = Failed ]    && FAILED="$FAILED durability-sweep"
                FAILED="${FAILED# }"
                [ -z "$FAILED" ] && FAILED="unknown (check the build)"
                HINT=""
                if [ "$RESULT_DURABILITY" = Failed ]; then
                  HINT='\n\nFor durability-sweep: check the CONTROLS first (t06/t07/t10). A red control means the INSTRUMENT, not the product. Grep the log for AGENT CANNOT RUN VMS -- that is an infrastructure answer, not a durability result.'
                fi
                curl -X POST -H 'Content-type: application/json' \
                  --data '{"text":"🚨 *Adaptive Commit Fuzz Failed (OSS)*\n\nFailed job(s): `'"$FAILED"'`\nBranch: `$(Build.SourceBranchName)`\nBuild: <$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)|#$(Build.BuildId)>\nCommit: `$(Build.SourceVersion)`'"$HINT"'"}' \
                  "$TMP_ADAPTIVE_COMMIT_ALERT_WEBHOOK"
            env:
              TMP_ADAPTIVE_COMMIT_ALERT_WEBHOOK: $(TMP_ADAPTIVE_COMMIT_ALERT_WEBHOOK)
